<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:#050a18;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
  font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,monospace;color:#fff;}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
#screen{position:relative;flex:1;min-height:0;overflow:hidden;background:#000;}
#cv{position:absolute;left:0;top:0;display:block;image-rendering:pixelated;}
#ui{position:absolute;inset:0;pointer-events:none;font-size:clamp(13px,3.6vmin,18px);}
#ui>*{pointer-events:auto;}
#hud{position:absolute;left:6px;right:6px;top:6px;display:none;justify-content:space-between;gap:8px;pointer-events:none;font-size:clamp(11px,3vmin,15px);}
#hud .hr{display:flex;gap:6px;background:none;border:none;box-shadow:none;padding:0;}
#hud .hb{pointer-events:auto;font:inherit;color:#fff;background:rgba(0,0,0,.8);border:2px solid #fff;border-radius:5px;box-shadow:0 0 0 2px #000;padding:0 10px;cursor:pointer;}

#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;}
#fade.on{opacity:1;}
#fade.enc{animation:enc .32s steps(4);}
@keyframes enc{0%{opacity:0;background:#fff}25%{opacity:.9}50%{opacity:.1}75%{opacity:.9}100%{opacity:1;background:#000}}
/* 操作パッド */
#pad{position:relative;height:clamp(150px,40vw,220px);display:flex;justify-content:space-between;align-items:center;padding:0 5vw;background:linear-gradient(#141c3a,#0a1028);border-top:2px solid #2a3a70;flex-shrink:0;}
#pad button{font:inherit;color:#fff;border:none;outline:none;touch-action:none;}
.dpad{position:relative;width:clamp(120px,34vw,170px);height:clamp(120px,34vw,170px);}
.dpad button{position:absolute;width:36%;height:36%;background:#3a4680;border-radius:10px;box-shadow:0 4px 0 #1a2040;font-size:20px;}
.dpad .u{left:32%;top:0}.dpad .d{left:32%;bottom:0}.dpad .l{left:0;top:32%}.dpad .r{right:0;top:32%}
.dpad::after{content:'';position:absolute;left:32%;top:32%;width:36%;height:36%;background:#2a3460;border-radius:6px;}
.abtn{display:flex;gap:4vw;align-items:center;}
.abtn button{width:clamp(60px,17vw,84px);height:clamp(60px,17vw,84px);border-radius:50%;font-size:24px;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.45);}
.abtn .ba{background:#e8435a;transform:translateY(-14px);} .abtn .bb{background:#3a8ae0;transform:translateY(10px);}
#pad .runb{align-self:flex-end;margin-bottom:10px;font-size:13px;font-weight:900;padding:8px 10px;border-radius:14px;background:#2a3460;box-shadow:0 3px 0 #10142a;letter-spacing:.05em;}
#pad .runb.on{background:#f0a020;color:#1a1000;}
body.land #pad .runb{position:absolute;left:2vw;bottom:calc(clamp(110px,30vh,160px) + 3vh + 10px);margin:0;}
#pad button.on{filter:brightness(1.4);box-shadow:none !important;}
body.land #app{flex-direction:row;}
body.land #pad{position:absolute;inset:0;height:auto;background:none;border:none;pointer-events:none;padding:0 2vw 3vh;align-items:flex-end;}

body.land .dpad{width:clamp(110px,30vh,160px);height:clamp(110px,30vh,160px);}
body.land .abtn{flex-direction:column;gap:2.5vh;}
body.land .abtn .ba,body.land .abtn .bb{transform:none;}
body.land .abtn button{width:clamp(54px,15vh,76px);height:clamp(54px,15vh,76px);}
body.land #ui{left:clamp(118px,32vh,175px);right:clamp(118px,32vh,175px);}

.menu{position:absolute;display:flex;flex-direction:column;max-height:86%;min-width:9em;}

.m-center{left:50%;top:50%;transform:translate(-50%,-50%);max-width:94%;}
.m-wide{left:50%;top:50%;transform:translate(-50%,-50%);width:min(94%,560px);}
.m-wide .ml{max-height:38vh;}
.m-det .minfo{min-height:9em;}
.m-title{left:50%;top:78%;transform:translate(-50%,-50%);min-width:12em;font-size:1.1em;}
body.land .m-title{top:84%;}
.m-yn{right:6%;bottom:calc(5.2em + 16px);}
.m-field{right:8px;top:40px;}
.m-cmd{left:6px;bottom:calc(5.4em + 14px);min-width:13em;}
.m-sub{left:50%;top:46%;transform:translate(-50%,-50%);max-width:94%;min-width:13em;}
.m-sub .ml{max-height:46vh;}

.msg .arrow{position:absolute;right:.6em;bottom:.2em;animation:blink .5s infinite alternate;font-size:.8em;}
.blog{position:absolute;left:6px;right:6px;bottom:6px;height:5.4em;overflow:hidden;font-size:1em;}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94%,560px);max-height:90%;overflow:auto;}
.p-list{font-size:.88em;}

.small{font-size:.8em;color:#c8d0f0;}
small{font-size:.78em;}
.mimg{image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle;}
.pv{display:flex;align-items:center;gap:.5em;}

.bc{flex:1;min-width:0;display:flex;align-items:center;gap:3px;background:rgba(0,0,0,.88);border:2px solid #fff;border-radius:6px;padding:2px 4px;box-shadow:0 0 0 2px #000;}

.bc.dead{border-color:#e33;opacity:.6;} .bc.pinch{border-color:#ffb020;}
.bc.hit{animation:hit .35s;}
.bc.act{animation:act .4s;}
@keyframes act{0%,100%{transform:none}40%{transform:translateY(-6px);border-color:#ffe14a}}
.bctl{position:absolute;right:6px;top:calc(2.6em + 14px);display:flex;gap:6px;z-index:3;}
.bctl button{font:inherit;font-size:12px;color:#fff;background:rgba(0,0,0,.8);border:2px solid #fff;border-radius:5px;padding:3px 8px;box-shadow:0 0 0 2px #000;cursor:pointer;}
.bctl button.on{background:#f0a020;color:#1a1000;}
.sbar{width:38%;}
.sbar i{display:block;height:6px;border-radius:3px;background:#5ac8ff;}
.sbar .s-hp{background:#4ae06a}.sbar .s-mp{background:#5a9aff}.sbar .s-atk{background:#ff6a4a}.sbar .s-def{background:#c8a04a}.sbar .s-agi{background:#4ad8d8}.sbar .s-int{background:#c87aff}
.bar.xp{height:4px;background:#333;margin-top:3px}.bar.xp i{background:linear-gradient(90deg,#ffd84a,#ff9a3a);}
.p-result{width:min(92%,420px);}
.p-result .mt{color:#ffe48a;border-bottom:1px dashed #777;margin-bottom:.3em;}
.p-result .rr{display:flex;align-items:center;gap:.5em;padding:.15em 0;}
.p-result .rr.dead{opacity:.5}
.p-result .rn{flex:1;font-size:.9em;line-height:1.3}
.p-result .rn .up{color:#7aff9a;font-weight:bold;}
.p-result .rx{width:32%;text-align:right;font-size:.9em;color:#ffe48a;}
.p-result .rg{display:flex;gap:1em;justify-content:center;margin-top:.3em;font-size:.9em;}
.m-slot .mi .sb{font-size:.78em;}
@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-5px);background:#a22}75%{transform:translateX(5px)}}
.bci{flex:1;min-width:0;}
.bcn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92em;}
.bcn small{color:#d8a8ff;margin-left:2px;}
.bar{height:5px;background:#333;border-radius:3px;overflow:hidden;margin:1px 0;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3ae86a,#aaf05a);}
.bc.pinch .bar i{background:#ffb020;}
.bcv{font-size:.8em;color:#cde;white-space:nowrap;}
/* 配合演出 */
.p-breed{text-align:center;overflow:hidden;}
.banim{display:flex;justify-content:center;align-items:center;gap:1em;animation:bmerge 2.2s forwards;}
.bheart{font-size:2em;color:#ff5a8a;animation:blink .3s infinite alternate;}
.bchild{opacity:0;animation:bchild 2.2s forwards;}
@keyframes bmerge{0%{gap:3em}60%{gap:0;opacity:1}80%,100%{opacity:0;height:0}}
@keyframes bchild{0%,60%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:scale(1)}}
.p-credits{width:100%;height:100%;max-height:100%;top:0;left:0;transform:none;border-radius:0;background:#000;text-align:center;overflow:hidden;}
.credits{height:100%;position:relative;overflow:hidden;}
.roll{position:absolute;left:0;right:0;top:100%;animation:roll 22s linear forwards;}
.roll h2{color:#ffcf3a;margin:.2em} .roll h3{color:#9ad8ff;margin:.2em} .roll p{margin:.5em}
@keyframes roll{to{top:-120%}}
</style>

// ===================== ユーティリティ =====================
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
const R = Math.random;
function ri(a,b){ return a+Math.floor(R()*(b-a+1)); }
function pick(arr){ return arr[Math.floor(R()*arr.length)]; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

// ===================== モンスター図鑑の生成 =====================
const MONS = []; const MON_BY_NAME = {};
(function buildMons(){
  let id=0;
  for(const f of FAM_KEYS){
    MON_NAMES[f].forEach((name,i)=>{
      const rank = Math.min(9, 1+Math.floor(i*9/21));
      MONS.push({id:id++, name, fam:f, rank, idx:i});
    });
  }
  for(const L of LEGENDS){ MONS.push({id:id++, name:L.name, fam:L.fam, rank:10, idx:21, legend:1}); }
  for(const m of MONS){
    MON_BY_NAME[m.name]=m;
    const rng = mulberry(hashStr(m.name)*7+13);
    m.seed = hashStr(m.name);
    m.maxLv = m.legend?99:Math.min(99, 30+m.rank*7);
    // 個体差のある能力の伸び
    const prof = FAM[m.fam].prof;
    m.grow = STATS.map((s,k)=> +(prof[k]*(0.85+rng()*0.35)).toFixed(3));
    // 特徴的な名前による補正
    const n=m.name;
    if(/メタル|ハガネ|ヨロイ|テツ|イワ|ダイヤ/.test(n)) m.grow[3]*=1.3;
    if(/マッハ|ハヤ|ツバメ|ヒョウ/.test(n)) m.grow[4]*=1.3;
    if(/マジョ|マドウ|フクロ|ヒーラー|マキモノ/.test(n)) m.grow[5]*=1.3, m.grow[1]*=1.2;
    if(/キング|オウ|ジン|カミ|エンペラー/.test(n)) m.grow=m.grow.map(g=>g*1.08);
    // 覚える技 3つ
    const pool = FAM_SKILLS[m.fam];
    const low = pool[0].slice(), high = pool[1].slice();
    const sk=[];
    const want = m.rank>=8?2:m.rank>=5?1:0; // 中級の数
    for(let k=0;k<want;k++){ const j=Math.floor(rng()*high.length); sk.push(high.splice(j,1)[0]); }
    while(sk.length<3){ const j=Math.floor(rng()*low.length); sk.push(low.splice(j,1)[0]); }
    if(m.name==='タコぼう') { sk[0]='sumihaki'; sk[1]='iyashi'; sk[2]='takoashi'; }
    if(/ダコ|タコ/.test(m.name) && !sk.includes('takoashi')) sk[2]='takoashi';
    if(m.legend){ sk[0]= {jelly:'minnazenkai',dragon:'goukabreath',beast:'starstrike',sea:'zettaireido',demon:'daibakuha'}[m.fam]; sk[1]='raijin'; sk[2]= m.fam==='demon'?'sayonarara':'minnaiyashi'; }
    m.skills = sk;
    m.learnLv = [1, 3+m.rank*2, 8+m.rank*4].map(v=>Math.min(v,60));
    // スカウトのしやすさ
    m.scout = m.legend?0.02: clamp(0.42 - m.rank*0.04,0.04,0.5);
  }
})();

// ===================== モンスター個体 =====================
let UID=1;
function baseStat(m,k){ const b=[14,6,9,7,7,6][k]; const r=[4,3,3,3,3,3][k]; return Math.round((b+m.rank*r)*FAM[m.fam].prof[k]); }
function growStat(m,k){ return [6.2,2.6,2.6,2.4,2.4,2.4][k]*m.grow[k]*(0.9+m.rank*0.045); }
function newMon(sid, lv=1, opt={}){
  const m = MONS[sid];
  const o = {uid:UID++, sid, lv:1, exp:0, plus:opt.plus||0, gender: opt.gender || (R()<0.5?'♂':'♀'),
    st:{}, skills:[], tactic:0, loyal: opt.loyal ?? 60, status:{} };
  STATS.forEach((s,k)=> o.st[s]= baseStat(m,k) + ri(0,2));
  if(opt.base){ STATS.forEach(s=> o.st[s]=Math.max(o.st[s], opt.base[s])); }
  learnSkills(o,true);
  while(o.lv<lv && o.lv<maxLv(o)) levelUp(o,true);
  o.exp = expFor(o.lv);
  o.hp=o.st.hp; o.mp=o.st.mp;
  return o;
}
function monName(o){ return MONS[o.sid].name; }
function maxLv(o){ return Math.min(99, MONS[o.sid].maxLv + o.plus*3); }
function expFor(lv){ const r = 1; return lv<=1?0: Math.floor(Math.pow(lv-1,2.5)*5*r + (lv-1)*8); }
function capStat(s,v){ return clamp(Math.round(v),1,999); }
function levelUp(o,silent){
  const m=MONS[o.sid]; const gains={};
  if(o.lv>=maxLv(o)) return null;
  o.lv++;
  const plusB = 1+o.plus*0.04;

const FAM_OFFSET = {jelly:0,dragon:1,beast:2,bird:-1,plant:-2,bug:1,demon:2,ghost:-1,matter:0,sea:-2};
function breedResult(a,b){
  const ma=MONS[a.sid], mb=MONS[b.sid];
  for(const [x,y,z] of SPECIAL_BREED){
    if((ma.name===x&&mb.name===y)||(ma.name===y&&mb.name===x)) return MON_BY_NAME[z].id;
  }
  // 血統(a)の系統の中から決まる
  const fam = ma.fam;
  const list = MONS.filter(m=>m.fam===fam && !m.legend);
  let idx;
  if(ma.fam===mb.fam){ idx = Math.max(ma.idx, mb.idx) + 1 + ((ma.idx+mb.idx)%2); }
  else { const avg = Math.round((ma.idx+mb.idx)/2); idx = Math.max(ma.idx+1, avg+2) + Math.sign(FAM_OFFSET[mb.fam])*((ma.idx+mb.idx)%2); }
  // 低ランク同士でも先へ進めるよう、親の血統より少し上を保証
  idx = Math.max(idx, ma.idx - 1);
  idx = clamp(idx, 0, list.length-1);
  if(list[idx].id===a.sid && idx<list.length-1 && R()<0.0) idx++;

}
function canBreed(a,b){
  if(!a||!b||a===b) return 'えらんでください';
  if(a.lv<10||b.lv<10) return 'レベル10以上が必要です';
  if(a.gender===b.gender) return '♂と♀でないと配合できません';
  return null;
}
function doBreed(a,b){
  const sid = breedResult(a,b);
  const plus = Math.max(a.plus,b.plus)+1 + ((a.lv+b.lv)>=120?1:0);
  const base={}; STATS.forEach(s=> base[s]=Math.floor((a.st[s]+b.st[s])/4));
  const child = newMon(sid,1,{plus,base});
  // とくぎ継承
  const inherit=[];
  for(const s of [...a.skills,...b.skills]){ if(!inherit.some(x=>skillLine(x).includes(s))) inherit.push(s); }
  // 系列の最上位のみ残す
  const best=[]; for(const s of inherit){ const line=skillLine(s); const top=[...a.skills,...b.skills].filter(x=>line.includes(x)); const pickS = top.sort((x,y)=>tierOf(y)-tierOf(x))[0]; if(!best.includes(pickS)) best.push(pickS); }
  for(const s of best){ if(child.skills.length>=8) break; if(!hasSkillLine(child,s)) child.skills.push(s); }
  // 子の固有技が後で覚えられるよう、とくぎが8を超えたら古い技を優先で残す
  child.skills = child.skills.slice(0,8);
  if(G.items.haigounohana>0){ G.items.haigounohana--; STATS.forEach(s=>child.st[s]=capStat(s,child.st[s]*1.1)); }
  fullHeal(child);
  return child;
}

  const hl=c.createRadialGradient(40,34,4,40,34,70); hl.addColorStop(0,'rgba(255,255,255,0.28)'); hl.addColorStop(1,'rgba(255,255,255,0)'); c.fillStyle=hl; c.fillRect(0,0,128,128);
  const sh=c.createLinearGradient(30,30,118,122); sh.addColorStop(0.45,'rgba(10,0,30,0)'); sh.addColorStop(1,'rgba(10,0,30,0.38)'); c.fillStyle=sh; c.fillRect(0,0,128,128);
  c.globalCompositeOperation='source-over';
  if(m.legend){ for(let i=0;i<6;i++){ star(c,14+((m.seed>>i)%100),12+((m.seed>>(i+3))%50),4,'#fff8b0'); } }
  c.restore();
  ART_CACHE[sid]=cv; return cv;
}

function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function nz(x,y,s=0){ let h=(x*374761393 + y*668265263 + s*1442695041)|0; h=(h^(h>>>13))*1274126177|0; return ((h^(h>>>16))>>>0)/4294967296; }
function px(c,x,y,col){ c.fillStyle=col; c.fillRect(x,y,1,1); }
function rect(c,x,y,w,h,col){ c.fillStyle=col; c.fillRect(x,y,w,h); }

const OLC='#14101c';

// ---------- 床 ----------
function paintFloor(c,p,kind,v){
  const g=p.g;
  rect(c,0,0,16,16,g[1]);
  const S=v*31+7;
  if(kind==='grass'){
    for(let y=0;y<16;y++) for(let x=0;x<16;x++){ const n=nz(x,y,S); if(n<0.07) px(c,x,y,g[0]); else if(n>0.93) px(c,x,y,g[2]); }
    for(let k=0;k<3;k++){ const x=Math.floor(nz(k,1,S)*13)+1, y=Math.floor(nz(k,2,S)*12)+2; px(c,x,y,g[0]); px(c,x+2,y,g[0]); px(c,x+1,y+1,g[0]); px(c,x,y-1,g[3]); px(c,x+2,y-1,g[3]); }
  } else if(kind==='dirt'){
    for(let y=0;y<16;y++) for(let x=0;x<16;x++){ const n=nz(x,y,S); if(n<0.1) px(c,x,y,g[0]); else if(n>0.9) px(c,x,y,g[2]); }
    for(let k=0;k<2;k++){ const x=Math.floor(nz(k,5,S)*12)+2, y=Math.floor(nz(k,6,S)*12)+2; rect(c,x,y,2,2,g[0]); px(c,x,y,g[3]); }
  } else if(kind==='sand'){
    for(let y=0;y<16;y++) for(let x=0;x<16;x++){ const n=nz(x,y,S); if(n<0.06) px(c,x,y,g[0]); else if(n>0.88) px(c,x,y,g[3]); }
    for(let k=0;k<2;k++){ const y=3+k*7+Math.floor(nz(k,3,S)*3); for(let x=2;x<12;x++) px(c,x+Math.floor(nz(k,4,S)*3),y+(x%5===0?1:0),g[2]); }
  } else if(kind==='ice'){
    rect(c,0,0,16,16,g[2]); for(let i=0;i<16;i++){ px(c,i,(i+v*5)%16,g[3]); } rect(c,0,15,16,1,g[1]); rect(c,15,0,1,16,g[1]);
    for(let k=0;k<3;k++) px(c,Math.floor(nz(k,7,S)*16),Math.floor(nz(k,8,S)*16),'#ffffff');
  } else if(kind==='stone'||kind==='tile'){
    rect(c,0,0,16,16,g[kind==='tile'?2:1]);
    const off=(v%2)*8;
    for(let y=0;y<16;y+=8){ rect(c,0,y,16,1,g[0]); for(let x=(y/8%2?off:off+4)%8;x<16;x+=8) rect(c,x,y,1,8,g[0]); }
    for(let y=1;y<16;y+=8) rect(c,0,y,16,1,g[kind==='tile'?3:2]);
    for(let k=0;k<4;k++) px(c,Math.floor(nz(k,9,S)*16),Math.floor(nz(k,10,S)*16),g[0]);
  } else if(kind==='plate'){
    rect(c,0,0,16,16,g[2]); rect(c,0,0,16,1,g[3]); rect(c,0,0,1,16,g[3]); rect(c,0,15,16,1,g[0]); rect(c,15,0,1,16,g[0]);
    for(const [x,y] of [[2,2],[13,2],[2,13],[13,13]]){ px(c,x,y,g[0]); px(c,x+1,y+1,g[3]); }
  } else if(kind==='check'){
    for(let y=0;y<16;y++) for(let x=0;x<16;x++) px(c,x,y,((x>>3)+(y>>3))%2?g[2]:g[3]);
    if(v%3===0){ px(c,4,4,'#fff'); px(c,3,4,'#ffe8ff'); px(c,5,4,'#ffe8ff'); px(c,4,3,'#ffe8ff'); px(c,4,5,'#ffe8ff'); }
  } else if(kind==='cloudf'){
    rect(c,0,0,16,16,g[3]); for(let k=0;k<4;k++){ const x=Math.floor(nz(k,11,S)*12), y=Math.floor(nz(k,12,S)*12); rect(c,x,y+2,5,2,g[2]); rect(c,x+1,y+1,3,1,g[2]); }
  } else if(kind==='wood'){
    for(let y=0;y<16;y+=4){ rect(c,0,y,16,4,(y/4+v)%2?g[2]:g[1]); rect(c,0,y+3,16,1,g[0]); const sx=Math.floor(nz(y,13,S)*14); rect(c,sx,y,1,3,g[0]); px(c,(sx+6)%16,y+1,g[3]); }
  }
}
// ---------- 壁 ----------
function paintWall(c,p,kind,face,v){
  const w=p.wr, S=v*17+3;
  if(kind==='tree'){
    // 地面
    rect(c,0,0,16,16,p.g[1]);
    if(face){ rect(c,6,10,4,6,'#5a3218'); rect(c,6,10,1,6,'#7a4a24'); rect(c,9,10,1,6,'#3a200e'); }
    const cy = face?7:8;
    const blob=(cx,cy2,r,col)=>{ c.fillStyle=col; c.beginPath(); c.arc(cx,cy2,r,0,Math.PI*2); c.fill(); };
    blob(8,cy,face?7.5:8.5,OLC); blob(8,cy,face?6.5:7.6,w[1]);
    blob(6.5,cy-1.5,face?4.5:5,w[2]); blob(5.5,cy-2.5,2.4,w[3]);
    for(let k=0;k<5;k++){ const x=Math.floor(nz(k,1,S)*10)+3, y=Math.floor(nz(k,2,S)*8)+cy-4; px(c,x,y,w[0]); }
    if(!face){ rect(c,0,14,16,2,w[0]); }
    return;
  }
  if(kind==='rock'){
    rect(c,0,0,16,16,w[1]);
    if(face){
      rect(c,0,0,16,4,w[2]); rect(c,0,0,16,1,w[3]);
      for(let y=4;y<16;y++) for(let x=0;x<16;x++){ const n=nz(x,y,S); if(n<0.12) px(c,x,y,w[0]); else if(n>0.92) px(c,x,y,w[2]); }
      for(let k=0;k<3;k++){ const x=Math.floor(nz(k,4,S)*12)+1, y=Math.floor(nz(k,5,S)*8)+5; rect(c,x,y,4,3,w[2]); rect(c,x,y+3,4,1,w[0]); px(c,x,y,w[3]); }
      rect(c,0,15,16,1,w[0]);
    } else { rect(c,0,0,16,16,w[0]); for(let k=0;k<6;k++) px(c,Math.floor(nz(k,6,S)*16),Math.floor(nz(k,7,S)*16),w[1]); }
    return;
  }
  if(kind==='brick'||kind==='plaster'||kind==='metal'||kind==='icewall'){
    if(!face){ rect(c,0,0,16,16,w[0]); rect(c,0,0,16,1,w[kind==='plaster'?0:1]); for(let k=0;k<4;k++) px(c,Math.floor(nz(k,8,S)*16),Math.floor(nz(k,9,S)*16),w[1]); return; }
    if(kind==='brick'){
      rect(c,0,0,16,16,w[2]);
      for(let y=0;y<16;y+=4){ rect(c,0,y,16,1,w[1]); const off=(y/4)%2?0:4; for(let x=off;x<16;x+=8) rect(c,x,y,1,4,w[1]); rect(c,0,y+1,16,1,w[3]); }
      rect(c,0,0,16,2,w[0]);
    } else if(kind==='plaster'){
      rect(c,0,0,16,16,w[2]); rect(c,0,0,16,2,w[0]); rect(c,0,12,16,4,w[0]); rect(c,0,12,16,1,'#6a4428');
      for(let k=0;k<3;k++) px(c,Math.floor(nz(k,10,S)*16),Math.floor(nz(k,11,S)*9)+2,w[3]);
    } else if(kind==='metal'){
      rect(c,0,0,16,16,w[2]); rect(c,0,0,16,2,w[0]); rect(c,0,7,16,1,w[1]); rect(c,0,8,16,1,'#8a94a4');
      for(const x of [2,13]) for(const y of [4,11]) px(c,x,y,w[3]);
      for(let x=0;x<16;x+=4) rect(c,x,14,2,2,w[3]);
    } else {
      rect(c,0,0,16,16,w[2]); rect(c,0,0,16,2,w[0]); for(let i=0;i<10;i++) px(c,(i*3+v)%16,3+i,w[3]); rect(c,0,15,16,1,w[1]);
    }
    return;
  }
  if(kind==='cloud'){
    rect(c,0,0,16,16,p.g[1]);
    const blob=(cx,cy,r,col)=>{ c.fillStyle=col; c.beginPath(); c.arc(cx,cy,r,0,Math.PI*2); c.fill(); };
    blob(5,9,5.5,w[1]); blob(11,9,5.5,w[1]); blob(8,6,5.5,w[1]);
    blob(5,8,4.5,w[2]); blob(11,8,4.5,w[2]); blob(8,5,4.5,w[3]); blob(6.5,4,1.8,'#ffffff');
    if(!face) rect(c,0,13,16,3,w[1]);
  }
}
// ---------- 各タイル ----------
const TILE_CACHE={};
function tileCanvas(theme,t,v,frame,face,extra){
  const key=theme+'|'+t+'|'+v+'|'+frame+'|'+(face?1:0)+'|'+(extra||'');
  if(TILE_CACHE[key]) return TILE_CACHE[key];
  const cv=mkCanvas(16,16), c=cv.getContext('2d'); const p=TP[theme]||TP.forest;
  paintTile(c,p,theme,t,v,frame,face,extra);
  TILE_CACHE[key]=cv; return cv;
}
const T_FLOOR=0,T_WALL=1;
function paintTile(c,p,theme,t,v,fr,face,extra){
  const g=p.g;
  const floor=()=>paintFloor(c,p,p.floor,v%4);
  switch(t){
    case 0: floor(); break;
    case 1: paintWall(c,p,p.wall,face,v%4); break;
    case 2: floor(); rect(c,2,2,12,12,OLC); for(let i=0;i<4;i++){ rect(c,3,3+i*3,10,2,i%2?'#6a5a4a':'#8a7a68'); rect(c,3,5+i*3,10,1,'#2a2018'); } rect(c,3,3,1,11,'#3a3028'); break;
    case 3: case 4: { floor(); const open=t===4;
      rect(c,2,5,12,9,OLC); rect(c,3,6,10,7,open?'#4a2a12':'#a0602a'); rect(c,3,6,10,2,open?'#2a1608':'#c47a36');
      rect(c,3,9,10,1,'#e8b030'); rect(c,7,8,2,3,'#ffd84a'); px(c,7,9,OLC); rect(c,3,12,10,1,'#6a3a16');
      if(open){ rect(c,2,2,12,3,OLC); rect(c,3,3,10,2,'#8a5022'); } break; }
    case 5: { const lava=p.water==='lava';
      const a=lava?['#c8300c','#f0601a','#ffa040','#ffe08a']:['#1e5aa8','#2e74c8','#58a0e8','#c8ecff'];
      rect(c,0,0,16,16,a[1]);
      for(let k=0;k<4;k++){ const y=(k*4+fr*2)%16, x=(k*5+fr*3)%12; rect(c,x,y,4,1,a[2]); px(c,x+1,y-1<0?15:y-1,a[3]); }
      for(let y=0;y<16;y++) for(let x=0;x<16;x++) if(nz(x,y,fr+v*3)<0.04) px(c,x,y,a[0]);
      if(face){ rect(c,0,0,16,2,a[3]); rect(c,0,2,16,1,a[2]); }
      break; }
    case 6: { // 道
      rect(c,0,0,16,16,'#d4b47c'); for(let y=0;y<16;y++) for(let x=0;x<16;x++){ const n=nz(x,y,v+50); if(n<0.08) px(c,x,y,'#a88a56'); else if(n>0.94) px(c,x,y,'#eedcac'); }
      for(let k=0;k<2;k++){ const x=Math.floor(nz(k,21,v)*12)+2,y=Math.floor(nz(k,22,v)*12)+2; rect(c,x,y,3,2,'#b89a66'); px(c,x,y,'#f0e0b8'); } break; }
    case 7: { floor(); const cols=[['#ff5a7a','#ffd0dc'],['#ffe04a','#fff6c0'],['#ffffff','#ffd0f0'],['#8a7aff','#e0dcff']];
      for(let k=0;k<4;k++){ const x=2+(k%2)*7+Math.floor(nz(k,30,v)*3), y=2+Math.floor(k/2)*7+Math.floor(nz(k,31,v)*3); const [a,b]=cols[(k+v)%4];
        px(c,x+1,y+3,'#2e7a2a'); px(c,x+1,y+4,'#2e7a2a'); px(c,x+1,y,a); px(c,x,y+1,a); px(c,x+2,y+1,a); px(c,x+1,y+2,a); px(c,x+1,y+1,b); } break; }
    case 8: { // 家の壁
      rect(c,0,0,16,16,'#f0e6cc'); rect(c,0,0,16,1,'#c8b88c'); rect(c,0,0,2,16,'#8a5a32'); rect(c,14,0,2,16,'#8a5a32'); rect(c,0,15,16,1,'#a89870'); rect(c,0,7,16,1,'#8a5a32'); break; }
    case 9: { // 屋根
      const rc = extra || '#c8382c'; const dark= shade(rc,-0.3), light=shade(rc,0.25);
      rect(c,0,0,16,16,rc); for(let y=0;y<16;y+=4){ rect(c,0,y+3,16,1,dark); for(let x=(y/4%2)*3;x<16;x+=6){ rect(c,x,y,1,3,dark); rect(c,x+1,y,3,1,light); } }
      if(face){ rect(c,0,13,16,3,dark); rect(c,0,13,16,1,OLC); } break; }
    case 10: { // 扉
      const wallC = extra==='castle'?null:'#f0e6cc';
      if(extra==='castle'){ paintTile(c,TP.castle,'castle',11,v,fr,1); } else if(extra==='in'){ paintWall(c,TP.house,'plaster',1,v); } else { rect(c,0,0,16,16,wallC); rect(c,0,0,2,16,'#8a5a32'); rect(c,14,0,2,16,'#8a5a32'); }
      rect(c,3,2,10,14,OLC); rect(c,4,3,8,13,'#7a4420'); rect(c,4,3,8,1,'#a0602e'); rect(c,7,3,1,13,'#4a2810'); rect(c,8,3,1,13,'#9a5a2a'); px(c,10,10,'#ffd84a'); px(c,5,10,'#ffd84a'); break; }
    case 11: { // 城壁
      rect(c,0,0,16,16,'#a8a4b8'); for(let y=0;y<16;y+=4){ rect(c,0,y,16,1,'#6e6a80'); const off=(y/4)%2?0:6; for(let x=off;x<16;x+=12) rect(c,x,y,1,4,'#6e6a80'); rect(c,0,y+1,16,1,'#c8c4d8'); }
      for(let k=0;k<3;k++) px(c,Math.floor(nz(k,40,v)*16),Math.floor(nz(k,41,v)*16),'#8a869c'); break; }
    case 12: paintFloor(c,TP.castle,'stone',v%4); break;
    case 13: { floor(); const cx=8,cy=8; rect(c,1,1,14,14,OLC); rect(c,2,2,12,12,'#1a2a6a');

const PIX_CACHE={};
function monPix(sid){
  if(PIX_CACHE[sid]) return PIX_CACHE[sid];
  const src=monCanvas(sid); const N=64;
  const tmp=mkCanvas(N,N), t=tmp.getContext('2d'); t.imageSmoothingEnabled=true; t.imageSmoothingQuality='high'; t.drawImage(src,0,0,N,N);
  let id; try{ id=t.getImageData(0,0,N,N); }catch(e){ PIX_CACHE[sid]=src; return src; }
  const d=id.data; const out=new Uint8ClampedArray(d.length);
  const op=(x,y)=> x>=0&&y>=0&&x<N&&y<N && d[(y*N+x)*4+3]>120;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const i=(y*N+x)*4; const a=d[i+3];
    if(a>120){
      // 影(床の楕円)は半透明なので除外される。色を少しまとめてドット感を出す
      const q=v=>Math.min(255,Math.round(v/20)*20+6);
      out[i]=q(d[i]); out[i+1]=q(d[i+1]); out[i+2]=q(d[i+2]); out[i+3]=255;
    } else if(op(x-1,y)||op(x+1,y)||op(x,y-1)||op(x,y+1)){ out[i]=20; out[i+1]=16; out[i+2]=28; out[i+3]=255; }
  }
  const cv=mkCanvas(N,N); cv.getContext('2d').putImageData(new ImageData(out,N,N),0,0);
  PIX_CACHE[sid]=cv; return cv;
}

const BG_CACHE={};
function battleBG(theme){
  if(BG_CACHE[theme]) return BG_CACHE[theme];
  const W=192,H=112; const cv=mkCanvas(W,H), c=cv.getContext('2d'); const p=TP[theme]||TP.forest;
  const sky=p.sky; const horizon=Math.floor(H*0.56);
  // 空(ディザ付きの段階グラデーション)
  const steps=8; const lerp=(a,b,t)=>{ const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16); const r=Math.round((A>>16)*(1-t)+(B>>16)*t), g=Math.round((A>>8&255)*(1-t)+(B>>8&255)*t), bb=Math.round((A&255)*(1-t)+(B&255)*t); return `rgb(${r},${g},${bb})`; };
  for(let i=0;i<steps;i++){ const y0=Math.floor(horizon*i/steps), y1=Math.floor(horizon*(i+1)/steps); rect(c,0,y0,W,y1-y0,lerp(sky[0],sky[1],i/(steps-1)));
    if(i<steps-1) for(let x=0;x<W;x+=2) px(c,x+((y1)%2),y1-1,lerp(sky[0],sky[1],(i+1)/(steps-1))); }
  const sil=(col,base,amp,freq,seed)=>{ c.fillStyle=col; c.beginPath(); c.moveTo(0,horizon); for(let x=0;x<=W;x+=4){ const y=base - amp*(0.5+0.5*Math.sin(x*freq+seed)) - amp*0.5*nz(x>>3,seed,3); c.lineTo(x,y); } c.lineTo(W,horizon); c.closePath(); c.fill(); };
  const T=theme;
  if(p.stars||T==='dark'||T==='demon'||T==='thunder'){ for(let k=0;k<60;k++) px(c,Math.floor(nz(k,1,9)*W),Math.floor(nz(k,2,9)*horizon*0.9),nz(k,3,9)>0.7?'#ffffff':'#a8a8d8'); }
  if(['forest','town','ranch','jungle','sky'].includes(T)){

    sil(p.wr[1],horizon-6,14,0.08,2); sil(p.wr[2],horizon,8,0.13,6);
    if(T==='lava'){ for(let k=0;k<5;k++){ const x=Math.floor(nz(k,9,1)*W); rect(c,x,horizon-30+k*3,2,30,'#ff7a20'); } }
    if(T==='bone'){ for(let k=0;k<6;k++){ const x=Math.floor(nz(k,8,2)*W), y=horizon-6-Math.floor(nz(k,9,2)*10); rect(c,x,y,8,2,'#e8e0c8'); rect(c,x-1,y-1,2,4,'#e8e0c8'); rect(c,x+7,y-1,2,4,'#e8e0c8'); } }
  } else if(T==='ice'){
    sil('#d8f0ff',horizon-20,26,0.04,1); sil('#9acaf0',horizon-6,14,0.07,3);
    for(let x=0;x<W;x+=16){ c.fillStyle='#ffffff'; c.beginPath(); c.moveTo(x,horizon); c.lineTo(x+8,horizon-20-nz(x,1,1)*10); c.lineTo(x+16,horizon); c.fill(); }
  } else if(T==='sea'){
    rect(c,0,horizon-22,W,22,'#2a7ad8'); for(let y=horizon-22;y<horizon;y+=3) for(let x=(y%6);x<W;x+=12) rect(c,x,y,5,1,'#8ad0ff');
    c.fillStyle='#fff6c0'; c.beginPath(); c.arc(W*0.8,22,10,0,7); c.fill();
  } else if(T==='desert'){
    c.fillStyle='#fff0a0'; c.beginPath(); c.arc(W*0.75,24,14,0,7); c.fill();
    sil('#e8b870',horizon-10,14,0.03,1); sil('#d09a50',horizon-2,8,0.06,5);
    for(const x of [30,140]){ rect(c,x,horizon-26,4,24,'#4a8a3a'); rect(c,x-6,horizon-18,6,3,'#4a8a3a'); rect(c,x-6,horizon-24,3,8,'#4a8a3a'); rect(c,x+4,horizon-20,6,3,'#4a8a3a'); rect(c,x+8,horizon-26,3,8,'#4a8a3a'); }

    for(let k=0;k<5;k++){ const cx=20+k*40, cy=horizon-18-(k%2)*10, r=12; c.fillStyle='#3a4250'; c.beginPath(); for(let i=0;i<16;i++){ const a=i/16*Math.PI*2; const rr=i%2?r:r+4; c.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);} c.fill(); c.fillStyle='#5a6474'; c.beginPath(); c.arc(cx,cy,5,0,7); c.fill(); }

  } else { // dark demon star thunder castle
    for(let x=8;x<W;x+=40){ rect(c,x,10,12,horizon-10,p.wr[1]); rect(c,x,10,3,horizon-10,p.wr[2]); rect(c,x-2,8,16,4,p.wr[2]); }
    if(T==='thunder'){ c.strokeStyle='#ffe14a'; c.lineWidth=2; c.beginPath(); c.moveTo(60,0); c.lineTo(52,20); c.lineTo(62,22); c.lineTo(50,46); c.stroke(); }
    if(T==='demon'){ c.fillStyle='#ff3a5a'; c.beginPath(); c.arc(W/2,20,9,0,7); c.fill(); }
  }
  // 地面
  for(let y=horizon;y<H;y++) for(let x=0;x<W;x++){ const n=nz(x,y,77); const t=(y-horizon)/(H-horizon); px(c,x,y, n<0.08?p.g[0]: n>0.94?p.g[3]: t<0.15?p.g[2]:p.g[1]); }
  rect(c,0,horizon,W,1,p.g[0]);
  BG_CACHE[theme]=cv; return cv;
}

function setupPad(){
  const bind=(el,b)=>{
    const down=e=>{ e.preventDefault(); el.classList.add('on'); press(b); if(navigator.vibrate) try{ navigator.vibrate(8); }catch(_){} };
    const up=e=>{ e.preventDefault(); el.classList.remove('on'); };
    el.addEventListener('pointerdown',down); el.addEventListener('pointerup',up); el.addEventListener('pointerleave',up); el.addEventListener('pointercancel',up);
  };
  document.querySelectorAll('.abtn [data-b]').forEach(el=>bind(el,el.dataset.b));
  // スライドできる十字キー
  const dp=document.querySelector('.dpad'); if(!dp) return;
  let cur=null, rep=null, pid=null;
  const btns={}; dp.querySelectorAll('[data-b]').forEach(b=>btns[b.dataset.b]=b);
  const setDir=d=>{
    if(d===cur) return;
    if(cur){ delete INPUT.held[cur]; btns[cur]&&btns[cur].classList.remove('on'); }
    cur=d; clearInterval(rep);
    if(d){ INPUT.held[d]=performance.now(); INPUT.lastDir=d; btns[d]&&btns[d].classList.add('on'); press(d); if(navigator.vibrate) try{ navigator.vibrate(6); }catch(_){}
      rep=setInterval(()=>{ if(UI.stack.length) press(d); },170); }
  };
  const calc=e=>{ const r=dp.getBoundingClientRect(); const x=e.clientX-(r.left+r.width/2), y=e.clientY-(r.top+r.height/2); if(Math.hypot(x,y)<r.width*0.12) return cur; return Math.abs(x)>Math.abs(y)?(x>0?'right':'left'):(y>0?'down':'up'); };
  dp.addEventListener('pointerdown',e=>{ e.preventDefault(); pid=e.pointerId; try{ dp.setPointerCapture(pid); }catch(_){} MAPS.autoPath=null; setDir(calc(e)); });
  dp.addEventListener('pointermove',e=>{ if(e.pointerId!==pid) return; e.preventDefault(); setDir(calc(e)); });
  const end=e=>{ if(e.pointerId!==pid) return; pid=null; setDir(null); };
  dp.addEventListener('pointerup',end); dp.addEventListener('pointercancel',end); dp.addEventListener('lostpointercapture',end);
  // ダッシュボタン
  const run=document.getElementById('runbtn'); if(run){ run.addEventListener('pointerdown',e=>{ e.preventDefault(); if(G){ G.run=!G.run; } updateRunBtn(); SND.init(); SND.se('cur'); }); }
}

        d.addEventListener('click',e=>{ e.stopPropagation(); if(sel===i||o.oneTap!==false) { sel=i; upd(); ok(); } else { sel=i; upd(); } });
        list.appendChild(d); return d; });
      const layer={el};
      const upd=()=>{ items.forEach((d,i)=>d.classList.toggle('sel',i===sel)); if(items[sel]) items[sel].scrollIntoView({block:'nearest'}); if(info){ const t=o.info(sel); info.innerHTML=t||''; } if(o.onMove) o.onMove(sel); };
      const done=v=>{ this.remove(layer); res(v); };
      const ok=()=>{ const it=o.items[sel]; if(!it) return; if(it.dis){ SND.se('ng'); return; } SND.se('ok'); done(sel); };
      layer.onInput=b=>{
        const cols=o.cols||1; const n=o.items.length;
        if(b==='up'){ sel=(sel-cols+n)%n; SND.se('cur'); upd(); }
        else if(b==='down'){ sel=(sel+cols)%n; SND.se('cur'); upd(); }
        else if(b==='left'){ if(cols>1){ sel=(sel-1+n)%n; } else if(o.onLR){ o.onLR(-1,sel); } SND.se('cur'); upd(); }
        else if(b==='right'){ if(cols>1){ sel=(sel+1)%n; } else if(o.onLR){ o.onLR(1,sel); } SND.se('cur'); upd(); }

      this.add(layer); upd();

function genDungeon(gi,floor){
  const g=GATES[gi]; const last = floor===g.floors-1;
  const W = Math.min(35, 21 + floor*2 + Math.floor(gi/4)*2), H = W;
  const m=mkMap(W,H,1,{kind:'dungeon',gi,floor,theme:g.theme,name:g.name,id:'dungeon'}); const t=m.t;
  const set=(x,y,v)=>{ if(x>0&&y>0&&x<W-1&&y<H-1) t[y*W+x]=v; };
  if(last){
    const rx=Math.floor(W/2)-5, ry=Math.floor(H/2)-6;
    for(let y=ry;y<ry+13;y++) for(let x=rx;x<rx+11;x++) set(x,y,0);
    for(let y=ry+1;y<ry+12;y++) set(rx+5,y,14);
    for(const y of [ry+2,ry+5,ry+8,ry+11]){ set(rx+1,y,23); set(rx+9,y,23); }
    m.ents.push({type:'boss',x:rx+5,y:ry+2,sid:MON_BY_NAME[g.boss[0]].id,lv:g.boss[1]});
    m.start={x:rx+5,y:ry+11}; m.boss=true; return m;
  }
  const rooms=[]; let tries=0; const want = 5+Math.min(5,floor+Math.floor(gi/5));
  while(rooms.length<want && tries++<400){
    const rw=ri(4,8), rh=ri(4,7), rx=ri(1,W-rw-2), ry=ri(2,H-rh-2);
    if(rooms.some(r=> rx<r.x+r.w+1 && rx+rw+1>r.x && ry<r.y+r.h+2 && ry+rh+1>r.y)) continue;
    rooms.push({x:rx,y:ry,w:rw,h:rh,cx:rx+Math.floor(rw/2),cy:ry+Math.floor(rh/2)});
  }
  for(const r of rooms) for(let y=r.y;y<r.y+r.h;y++) for(let x=r.x;x<r.x+r.w;x++) set(x,y,0);
  const carve=(a,b)=>{ let x=a.cx,y=a.cy; const hf=R()<0.5;
    const sx=()=>{ while(x!==b.cx){ set(x,y,0); x+=Math.sign(b.cx-x);} }; const sy=()=>{ while(y!==b.cy){ set(x,y,0); y+=Math.sign(b.cy-y);} };
    if(hf){ sx(); sy(); } else { sy(); sx(); } set(x,y,0); };
  for(let i=1;i<rooms.length;i++) carve(rooms[i-1],rooms[i]);
  if(rooms.length>3) carve(rooms[0],rooms[rooms.length-2]);
  // 装飾
  for(const r of rooms){
    for(let k=0;k<Math.floor(r.w*r.h/6);k++){ const x=r.x+ri(0,r.w-1), y=r.y+ri(0,r.h-1); if(t[y*W+x]===0) t[y*W+x]=19; }
    if(r.w>=5&&r.h>=5){ for(let k=0;k<2;k++){ const x=r.x+ (R()<0.5?0:r.w-1), y=r.y+ri(1,r.h-2); if(t[y*W+x]===0||t[y*W+x]===19) t[y*W+x]=38; } }
    if(['sea','ice','jungle','forest'].includes(g.theme) && r.w>5 && r.h>5 && R()<0.5){ t[(r.y+1)*W+r.x+1]=5; t[(r.y+1)*W+r.x+2]=5; }
  }
  m.start = {x:rooms[0].cx,y:rooms[0].cy}; t[m.start.y*W+m.start.x]=0;
  const sr = rooms[rooms.length-1]; t[sr.cy*W+sr.cx]=2;

    if(this.id==='gatehall'){ const near=Object.keys(this.map.portals).find(k=>{ const [x,y]=k.split(',').map(Number); return Math.abs(x-this.px)<=1 && Math.abs(y-this.py)<=1; }); if(near){ const name=GATES[this.map.portals[near]].name; c.font=`bold ${Math.round(ts*0.42)}px "DotGothic16",sans-serif`; c.textAlign='center'; const [nx,ny]=near.split(',').map(Number); const tx=ox+nx*ts+ts/2, ty=oy+ny*ts-ts*0.15; c.lineWidth=4; c.strokeStyle='#000'; c.strokeText(name,tx,ty); c.fillStyle='#fff'; c.fillText(name,tx,ty); c.textAlign='left'; } }
    PARTS.step(th, m.theme==='house'||m.theme==='castle', W, H, ts, c);
    if(m.kind==='dungeon' && this.explored && G.minimap!==false) this.drawMini(c,W,H);
  },
  drawMini(c,W,H){
    const m=this.map; const cell=clamp(Math.floor(Math.min(W,H)*0.32/m.w),2,5); const mw=m.w*cell, mh=m.h*cell; const x0=W-mw-8, y0=40;
    c.fillStyle='rgba(0,0,0,0.55)'; c.fillRect(x0-3,y0-3,mw+6,mh+6); c.strokeStyle='rgba(255,255,255,0.7)'; c.lineWidth=1; c.strokeRect(x0-3.5,y0-3.5,mw+7,mh+7);
    for(let y=0;y<m.h;y++) for(let x=0;x<m.w;x++){ const i=y*m.w+x; if(!this.explored[i]) continue; const t=m.t[i]; if(!PASSABLE.has(t)&&t!==3&&t!==4&&t!==5) continue;
      c.fillStyle= t===2?'#ffe14a': t===3?'#ff9a3a': t===5?'#4a8ae8':'rgba(170,200,255,0.75)'; c.fillRect(x0+x*cell,y0+y*cell,cell,cell); }
    for(const e of m.ents){ if(e.gone) continue; if(!this.explored[e.y*m.w+e.x]) continue; c.fillStyle=e.type==='boss'?'#ff3a5a':'#7aff9a'; c.fillRect(x0+e.x*cell,y0+e.y*cell,cell,cell); }
    if((this.tick>>4)&1){ c.fillStyle='#ff4a4a'; } else c.fillStyle='#ffffff'; c.fillRect(x0+this.px*cell-1,y0+this.py*cell-1,cell+2,cell+2);
  }
};

const PARTS = {
  list:[], theme:null,
  kind(th){ return {forest:'leaf',town:'leaf',ranch:'leaf',jungle:'leaf',ice:'snow',lava:'ember',sea:'spark',dream:'twinkle',star:'twinkle',demon:'mote',dark:'mote',desert:'sand',bone:'dust',cave:'dust',thunder:'rain',machine:'spark',cloud:'feather',sky:'feather'}[th]; },
  step(th,indoor,W,H,ts,c){
    if(indoor){ this.list=[]; this.theme=th; return; }
    if(th!==this.theme){ this.list=[]; this.theme=th; }
    const k=this.kind(th); if(!k) return; const u=Math.max(1,ts/16);
    const max = k==='rain'?70: k==='snow'?55: k==='sand'?30: 26;
    if(this.list.length<max && Math.random()<(k==='rain'?0.9:0.35)){
      const p={k,x:Math.random()*W,y:-10,vx:0,vy:0,life:0,max:400,s:u,c:'#fff',ph:Math.random()*6};
      if(k==='leaf'){ p.vy=0.5+Math.random()*0.6; p.vx=-0.3+Math.random()*0.3; p.c=pick(['#7cc04a','#a8d84a','#e8a83a','#d8682a']); }
      else if(k==='snow'){ p.vy=0.6+Math.random()*0.8; p.vx=-0.2+Math.random()*0.4; p.s=u*(Math.random()<0.3?2:1); }
      else if(k==='ember'){ p.y=H+5; p.vy=-(0.5+Math.random()*0.9); p.vx=-0.2+Math.random()*0.4; p.c=pick(['#ff8a2a','#ffd84a','#ff5a1a']); p.max=260; }
      else if(k==='spark'||k==='twinkle'){ p.y=Math.random()*H; p.max=50+Math.random()*40; p.c=k==='spark'?'#ffffff':pick(['#ffffff','#fff6a0','#d8c8ff']); }
      else if(k==='mote'){ p.y=Math.random()*H; p.vy=-0.2-Math.random()*0.3; p.max=220; p.c=pick(['#a87aff','#ff5a9a']); }
      else if(k==='sand'){ p.x=-20; p.y=Math.random()*H; p.vx=3+Math.random()*3; p.vy=0.3; p.c='rgba(255,230,170,0.7)'; }
      else if(k==='dust'){ p.y=Math.random()*H; p.vx=0.15; p.vy=-0.05; p.max=260; p.c='rgba(220,210,190,0.5)'; }
      else if(k==='rain'){ p.vy=9+Math.random()*4; p.vx=-2; p.c='rgba(170,190,255,0.55)'; p.max=120; }
      else if(k==='feather'){ p.vy=0.3+Math.random()*0.3; p.vx=0.2; p.c='rgba(255,255,255,0.85)'; }
      this.list.push(p);
    }
    for(const p of this.list){
      p.life++; p.x+=p.vx + (p.k==='leaf'||p.k==='snow'||p.k==='feather'? Math.sin(p.life/20+p.ph)*0.5:0); p.y+=p.vy;
      let a=1; if(p.k==='spark'||p.k==='twinkle') a=Math.sin(p.life/p.max*Math.PI); else if(p.k==='ember'||p.k==='mote'||p.k==='dust') a=Math.min(1,(p.max-p.life)/60);
      c.globalAlpha=Math.max(0,a); c.fillStyle=p.c;
      if(p.k==='rain'){ c.fillRect(p.x,p.y,u*0.6,u*5); }
      else if(p.k==='twinkle'||p.k==='spark'){ c.fillRect(p.x-u,p.y,u*3,u); c.fillRect(p.x,p.y-u,u,u*3); }
      else if(p.k==='leaf'){ c.fillRect(p.x,p.y,u*2,u); c.fillRect(p.x+u,p.y+u,u,u); }
      else if(p.k==='sand'){ c.fillRect(p.x,p.y,u*6,u*0.6); }
      else c.fillRect(p.x,p.y,p.s,p.s);
    }
    c.globalAlpha=1;
    this.list=this.list.filter(p=>p.life<p.max && p.y<H+20 && p.y>-30 && p.x<W+30 && p.x>-40);
  }
};

const EL_COL = {fire:'#ff6a2a',ice:'#8ae8ff',wind:'#9aff9a',boom:'#ffcf3a',thunder:'#fff36a',heal:'#7aff9a',status:'#c08aff',phys:'#ffffff'};
const ST_JP = {sleep:'ねむり',confuse:'こんらん',silence:'まふうじ',blind:'まぼろし',poison:'どく',paralyze:'マヒ'};
const BATTLE = {
  on:false, enemies:[], allies:[], fx:[], shake:0, theme:'forest', tick:0, mode:'wild', skip:null,
  draw(c,W,H){
    this.tick++;
    c.imageSmoothingEnabled=false;
    const n=this.enemies.length; const port=H>W*1.1;
    const base = port ? Math.min(H*0.64, H-215) : H*0.72;
    const size = port ? Math.min(W/(n>2?2.75:n>1?2.1:1.5), (base-50)*0.95, 340) : Math.min(W/(n>2?3.1:n>1?2.5:2), H*0.6, 300);
    const bg=battleBG(this.theme); const sc=Math.max(W/bg.width,H/bg.height)*1.02; const bw=bg.width*sc, bh=bg.height*sc;
    let y0=base-size*0.1-0.56*bh; y0=clamp(y0,H-bh,0);
    let sx=0, sy=0; if(this.shake>0){ sx=(Math.random()-0.5)*this.shake; sy=(Math.random()-0.5)*this.shake; this.shake*=0.85; if(this.shake<0.5) this.shake=0; }
    c.save(); c.translate(sx,sy);
    c.drawImage(bg,(W-bw)/2,y0,bw,bh);
    this.enemies.forEach((e,i)=>{
      const a=e.anim||(e.anim={shake:0,blink:0,alpha:1,act:0,die:0});
      if(e.hp<=0){ a.die=Math.min(1,(a.die||0)+0.05); } else a.die=0;
      if(a.die>=1) return;
      if(a.blink>0){ a.blink--; if((a.blink>>1)%2===1) return; }
      const cx = W/2 + (i-(n-1)/2)*size*0.95 + (a.shake>0?(Math.random()-0.5)*a.shake:0);
      const breathe=1+0.025*Math.sin(this.tick/11+i*2);
      const act=a.act>0?Math.sin((a.act/14)*Math.PI):0; if(a.act>0) a.act--;
      const s=size*(1+act*0.1);
      const hS=s*breathe*(1-(a.die||0)), wS=s/breathe*(1+(a.die||0)*0.3);
      e._x=cx; e._y=base-size*0.5;
      c.fillStyle='rgba(0,0,0,0.25)'; c.beginPath(); c.ellipse(cx,base-size*0.06,size*0.3,size*0.06,0,0,7); c.fill();
      c.globalAlpha=1-(a.die||0)*0.8;
      c.drawImage(monPix(e.sid),cx-wS/2,base-hS-act*size*0.06,wS,hS);
      c.globalAlpha=1;
      if(a.shake>0){ a.shake*=0.8; if(a.shake<0.5) a.shake=0; }
      if(e.hp>0){ const st=Object.keys(e.status||{}).filter(k=>ST_JP[k]); if(st.length){ c.font=`${Math.max(11,size*0.075)}px "DotGothic16",sans-serif`; c.fillStyle='#fff'; c.strokeStyle='#000'; c.lineWidth=3; const t=st.map(k=>ST_JP[k]).join(' '); c.textAlign='center'; c.strokeText(t,cx,base-size*0.95); c.fillText(t,cx,base-size*0.95); c.textAlign='left'; } }
    });
    for(const f of this.fx){
      f.t++;
      if(f.type==='num'){ const k=f.t/40; c.font=`${f.size||28}px "DotGothic16",sans-serif`; c.textAlign='center'; c.lineWidth=5; c.strokeStyle='#000'; c.fillStyle=f.col; c.globalAlpha=1-Math.max(0,k-0.6)*2.5; const yy=f.y-Math.min(f.t,12)*2.2; c.strokeText(f.text,f.x,yy); c.fillText(f.text,f.x,yy); c.globalAlpha=1; c.textAlign='left'; }
      else if(f.type==='burst'){ const k=f.t/24; for(let i=0;i<12;i++){ const a=i/12*Math.PI*2+f.t*0.1; const r=k*f.r; c.fillStyle=f.col; c.globalAlpha=1-k; const ps=Math.max(2,f.r*0.13*(1-k)); c.fillRect(f.x+Math.cos(a)*r-ps/2,f.y+Math.sin(a)*r-ps/2,ps,ps); } c.globalAlpha=1; }
      else if(f.type==='slash'){ const k=f.t/12; c.strokeStyle='#fff'; c.lineWidth=7*(1-k)+1; c.globalAlpha=1-k; c.beginPath(); c.moveTo(f.x-f.r,f.y-f.r); c.lineTo(f.x+f.r,f.y+f.r); c.stroke(); c.beginPath(); c.moveTo(f.x+f.r*0.6,f.y-f.r); c.lineTo(f.x-f.r*0.6,f.y+f.r); c.stroke(); c.globalAlpha=1; }
      else if(f.type==='el'){ drawElFx(c,f,W,H); }
      else if(f.type==='screen'){ c.fillStyle=f.col; c.globalAlpha=Math.max(0,0.45-f.t/30); c.fillRect(-20,-20,W+40,H+40); c.globalAlpha=1; }
    }
    this.fx=this.fx.filter(f=>f.t<(f.type==='num'?42:f.type==='burst'?24:f.type==='el'?30:f.type==='slash'?12:14));
    c.restore();
  }
};

function drawElFx(c,f,W,H){
  const k=f.t/30, R=f.r; const rnd=i=>nz(i,Math.floor(f.seed),3);
  c.save();
  if(f.el==='fire'){ for(let i=0;i<16;i++){ const life=(k*1.4+rnd(i)*0.6)%1; const x=f.x+(rnd(i+20)-0.5)*R*1.4, y=f.y+R*0.5-life*R*1.6; const sz=R*0.18*(1-life); c.globalAlpha=1-life; c.fillStyle=life<0.3?'#fff6a0':life<0.6?'#ffb030':'#ff4a1a'; c.fillRect(x-sz/2,y-sz/2,sz,sz*1.3); } }
  else if(f.el==='ice'){ for(let i=0;i<10;i++){ const d=Math.min(1,k*2-rnd(i)*0.6); if(d<=0) continue; const x=f.x+(rnd(i+5)-0.5)*R*1.6, y=f.y-R*1.2+d*R*1.4; const sz=R*0.14; c.globalAlpha=1-Math.max(0,k-0.7)*3; c.fillStyle=i%2?'#e8fbff':'#8ae8ff'; c.beginPath(); c.moveTo(x,y-sz*1.6); c.lineTo(x+sz*0.6,y); c.lineTo(x,y+sz*1.6); c.lineTo(x-sz*0.6,y); c.fill(); } }
  else if(f.el==='wind'){ c.strokeStyle='#c8ffc8'; c.lineCap='round'; for(let i=0;i<3;i++){ const a=k*Math.PI*4+i*2.1; c.globalAlpha=1-k; c.lineWidth=R*0.08; c.beginPath(); c.arc(f.x,f.y,R*(0.4+i*0.25),a,a+1.6); c.stroke(); } }
  else if(f.el==='boom'){ c.globalAlpha=1-k; c.fillStyle='rgba(255,240,180,0.9)'; c.beginPath(); c.arc(f.x,f.y,R*k*1.4,0,7); c.fill(); c.strokeStyle='#ff8a1a'; c.lineWidth=R*0.12; c.beginPath(); c.arc(f.x,f.y,R*k*1.8,0,7); c.stroke(); for(let i=0;i<8;i++){ const a=i/8*Math.PI*2; c.fillStyle='#ffd84a'; c.fillRect(f.x+Math.cos(a)*R*k*2-3,f.y+Math.sin(a)*R*k*2-3,6,6); } }
  else if(f.el==='thunder'){ if((f.t>>1)%2===0 || f.t<6){ c.strokeStyle='#fff8a0'; c.lineWidth=Math.max(3,R*0.09); c.globalAlpha=1-k*0.8; c.beginPath(); let x=f.x+(rnd(1)-0.5)*20, y=0; c.moveTo(x,y); const steps=7; for(let i=1;i<=steps;i++){ y=f.y*i/steps; x=f.x+(i===steps?0:(rnd(i+3)-0.5)*R*0.8); c.lineTo(x,y); } c.stroke(); c.strokeStyle='#ffffff'; c.lineWidth=Math.max(1,R*0.03); c.stroke(); } }
  else if(f.el==='heal'){ for(let i=0;i<10;i++){ const life=(k+rnd(i)*0.5)%1; const x=f.x+(rnd(i+9)-0.5)*R*1.6, y=f.y+R*0.3-life*R*1.4; c.globalAlpha=1-life; c.fillStyle=i%2?'#aaffbb':'#ffffff'; const u=Math.max(2,R*0.07); c.fillRect(x-u,y,u*3,u); c.fillRect(x,y-u,u,u*3); } }
  c.restore();
}

      this.ctlRender(); });
    this.ctlRender(); this.render(); },
  ctlRender(){ if(!this.ctl) return; const [a,sp]=this.ctl.children; a.classList.toggle('on',!!BATTLE.auto); sp.textContent=['▶','▶▶','▶▶▶'][G.speed??1]; },
  close(){ if(this.el) this.el.remove(); this.el=null; if(this.ctl) this.ctl.remove(); this.ctl=null; },
  render(){
    if(!this.el) return;
    this.el.innerHTML = BATTLE.allies.map(o=>{ const hpR=o.hp/o.st.hp; const st=Object.keys(o.status||{}).filter(k=>ST_JP[k]).map(k=>ST_JP[k][0]).join('');
      return `<div class="bc ${o.hp<=0?'dead':hpR<0.3?'pinch':''}" data-u="${o.uid}">${monImgHTML(o.sid,34)}<div class="bci"><div class="bcn">${monName(o)}<small>${st}</small></div>
      <div class="bar"><i style="width:${Math.round(hpR*100)}%"></i></div><div class="bcv">H${o.hp} M${o.mp} L${o.lv}</div></div></div>`; }).join('');
  },
  act(o){ if(!this.el) return; const d=this.el.querySelector(`[data-u="${o.uid}"]`); if(d){ d.classList.remove('act'); void d.offsetWidth; d.classList.add('act'); } },
  hit(o){ if(!this.el) return; const d=this.el.querySelector(`[data-u="${o.uid}"]`); if(d){ d.classList.remove('hit'); void d.offsetWidth; d.classList.add('hit'); } }
};

function bName(u){ return u.side==='e' ? monName(u)+(u.tag||'') : monName(u); }
function eff(u,s){ const b=(u.b&&u.b.buf[s])||0; return u.st[s]*(1+0.25*b); }
function alive(list){ return list.filter(u=>u.hp>0); }
function foesOf(u){ return u.side==='a'?BATTLE.enemies:BATTLE.allies; }
function friendsOf(u){ return u.side==='a'?BATTLE.allies:BATTLE.enemies; }
function isSpell(id){ const s=SK[id]; return s.type==='spell'||!!s.spell; }
function canUse(u,id){ const s=SK[id]; if(s.mp>u.mp) return false; if(u.status.silence && isSpell(id)) return false; return true; }
function allyPos(u){ const cv=document.getElementById('cv'); const W=cv.clientWidth,H=cv.clientHeight; const i=Math.max(0,BATTLE.allies.indexOf(u)); return {x:W*(0.18+0.32*i),y:Math.min(H*0.86,H-110)}; }
function popAt(u,text,col,size){ let x,y; if(u.side==='e'){ x=u._x||200; y=u._y||100; } else { const cv=document.getElementById('cv'); const W=cv.clientWidth,H=cv.clientHeight; const i=BATTLE.allies.indexOf(u); x=W*(0.2+0.3*i); y=H*0.86; } BATTLE.fx.push({type:'num',x,y,text:String(text),col,t:0,size:size||26}); return {x,y}; }

function initB(u,side){ u.side=side; u.b={buf:{atk:0,def:0,agi:0,int:0},guard:false,charge:false,cover:null,stun:false}; u.status=u.status||{}; }

// ---- AI ----
function estDmg(u,id,foes){
  const fa=alive(foes); if(!fa.length) return 0; const avgDef=fa.reduce((s,f)=>s+eff(f,'def'),0)/fa.length;
  const base=Math.max(1,eff(u,'atk')/2-avgDef/4);
  if(id==='attack') return base*(u.b.charge?2:1);
  const s=SK[id]; const cnt = s.tgt==='eAll'?fa.length:1;
  if(s.type==='spell'||s.type==='breath'||(s.type==='special'&&s.fx==='selfdestruct')){ if(s.fx==='selfdestruct') return (u.hp>u.st.hp*0.25||R()<0.5)?0:u.st.hp*0.8*fa.length; return (s.pw[0]+s.pw[1])/2*cnt*(1+eff(u,'int')/600); }
  if(s.type==='phys') return base*s.mul*(s.hits||1)*(s.tgt==='eAll'?fa.length:1)*(s.hit||1)*(u.b.charge?2:1);
  if(s.type==='status'){ const un=fa.filter(f=>!f.status[s.st]).length; return s.st==='death'? un*base*0.8*s.rate*3 : un*base*0.5*(s.tgt==='eAll'?1:0.8); }
  if(s.type==='debuff') return fa.length*base*0.3;
  return 0;
}
function chooseAI(u,tactic){
  const foes=foesOf(u), fr=friendsOf(u); const fa=alive(foes); const frA=alive(fr);
  const usable=u.skills.filter(id=>canUse(u,id) && (tactic!==3 || SK[id].mp===0));
  const healS=usable.filter(id=>SK[id].type==='heal' && SK[id].tgt!=='self');
  const thr = tactic===2?0.6:0.33;
  const low = frA.filter(f=>f.hp<f.st.hp*thr).sort((a,b)=>a.hp/a.st.hp-b.hp/b.st.hp);
  if(low.length && healS.length && R()<0.9){
    const all=healS.find(id=>SK[id].tgt==='aAll'); if(all && low.length>=2) return {id:all,t:frA};
    const one=healS.filter(id=>SK[id].tgt==='a1').sort((a,b)=>SK[b].pw[0]-SK[a].pw[0]); const need=low[0].st.hp-low[0].hp;
    const best = one.find(id=>SK[id].pw[0]<=need*1.3) || one[one.length-1] || all; return {id:best,t: SK[best].tgt==='aAll'?frA:[low[0]]};
  }
  const selfHeal=usable.find(id=>SK[id].tgt==='self' && SK[id].type==='heal'); if(selfHeal && u.hp<u.st.hp*0.35 && R()<0.6) return {id:selfHeal,t:[u]};
  const dead=fr.filter(f=>f.hp<=0); const rev=usable.find(id=>SK[id].type==='revive');
  if(dead.length && rev && tactic!==0 && R()<0.8) return {id:rev,t:[dead[0]]};
  if(tactic===2 && R()<0.35){ const buff=usable.find(id=>SK[id].type==='buff' && frA.some(f=>f.b.buf[SK[id].stat]<1)); if(buff) return {id:buff,t:SK[buff].tgt==='aAll'?frA:[pick(frA)]}; const cure=usable.find(id=>SK[id].type==='cure'); const sick=frA.find(f=>Object.keys(f.status).length); if(cure&&sick) return {id:cure,t:[sick]}; }
  const cands=[{id:'attack',v:estDmg(u,'attack',foes)}];
  for(const id of usable){ const s=SK[id]; if(['spell','breath','phys','status','debuff'].includes(s.type) || (s.type==='special'&&['drainmp','selfdestruct','stun'].includes(s.fx))) cands.push({id,v:estDmg(u,id,foes) + (s.fx==='drainmp'&&u.mp<u.st.mp*0.3?20:0)}); else if(s.type==='special' && s.fx==='charge' && !u.b.charge) cands.push({id,v:estDmg(u,'attack',foes)*0.9}); else if(s.type==='special' && s.fx==='mpheal' && u.mp<u.st.mp*0.3) cands.push({id,v:30}); else if(s.type==='buff' && frA.some(f=>f.b.buf[s.stat]<1)) cands.push({id,v:estDmg(u,'attack',foes)*0.5}); }
  let ch;
  if(tactic===1){ const tot=cands.reduce((s,c)=>s+Math.max(1,c.v),0); let r=R()*tot; ch=cands.find(c=>(r-=Math.max(1,c.v))<=0)||cands[0]; }
  else { cands.forEach(c=>c.v*= (0.8+R()*0.4) * (c.id!=='attack' && SK[c.id].mp>0 ? (tactic===2?0.6:1)/(1+SK[c.id].mp/Math.max(8,u.mp)) : 1)); ch=cands.sort((a,b)=>b.v-a.v)[0]; }
  const id=ch.id;
  if(id==='attack') return {id, t:[pickTarget(fa)]};
  const s=SK[id];
  if(s.tgt==='eAll') return {id,t:fa}; if(s.tgt==='rand') return {id,t:fa};
  if(s.tgt==='self') return {id,t:[u]};
  if(s.tgt==='a1'||s.tgt==='aAll') return {id,t:s.tgt==='aAll'?frA:[pick(frA)]};
  return {id,t:[pickTarget(fa,s)]};
}
function pickTarget(fa,s){ if(s && s.type==='status') { const un=fa.filter(f=>!f.status[s.st]); if(un.length) return pick(un); } if(R()<0.4) return fa.slice().sort((a,b)=>a.hp-b.hp)[0]; return pick(fa); }

// ---- ダメージ・効果 ----
async function damage(t,amt,col='#fff'){
  // かばう
  if(t.b.coveredBy && t.b.coveredBy.hp>0 && t.b.coveredBy!==t){ const cv=t.b.coveredBy; await blog(`${bName(cv)}が ${bName(t)}を かばった！`,0.6); t=cv; }
  if(t.b.guard) amt=Math.ceil(amt/2);
  amt=Math.max(0,Math.round(amt)); t.hp=Math.max(0,t.hp-amt);
  if(t.side==='e'){ t.anim=t.anim||{}; t.anim.shake=10; t.anim.blink=12; } else { BATTLE.shake=10; BSTAT.hit(t); }
  popAt(t,amt,col); SND.se('hit');
  await blog(t.side==='e'?`${bName(t)}に ${amt}のダメージ！`:`${bName(t)}は ${amt}のダメージを うけた！`);
  if(t.status.sleep && amt>0 && R()<0.5){ delete t.status.sleep; }
  if(t.hp<=0) await kill(t);
  BSTAT.render();
  return t;
}
async function kill(t){ t.hp=0; t.status={}; t.b.charge=false; if(t.side==='e'){ SND.se('down'); await blog(`${bName(t)}を たおした！`); } else { SND.se('down'); await blog(`${bName(t)}は ちからつきた……`); } BSTAT.render(); }
function resMul(t,el){ return (FAM[MONS[t.sid].fam].res[el]||1) * (MONS[t.sid].legend?0.8:1); }
function stResist(t,st){ return FAM[MONS[t.sid].fam].st[st]||0; }
async function tryStatus(u,t,st,rate){
  if(t.hp<=0) return;
  if(st==='death'){
    const ch = rate*(1-stResist(t,'death'))*clamp(1+(u.lv-t.lv)/30,0.25,1.2) * (t.boss?0.15:1) * (MONS[t.sid].legend?0.1:1);
    if(R()<ch){ BATTLE.fx.push({type:'screen',col:'#000',t:0}); await kill(t); } else await blog(`${bName(t)}には きかなかった！`,0.7);
    return;
  }
  if(t.status[st]){ await blog(`${bName(t)}は すでに ${ST_JP[st]}状態だ`,0.6); return; }
  const ch = rate*(1-stResist(t,st))*(t.boss?0.5:1);
  if(R()<ch){ t.status[st]= st==='poison'?99: ri(2,4);
    const msg={sleep:'ねむってしまった！',confuse:'こんらんした！',silence:'呪文を ふうじこめられた！',blind:'まぼろしに つつまれた！',poison:'どくに おかされた！',paralyze:'からだが しびれて うごけなくなった！'}[st];
    popAt(t,ST_JP[st],'#d8a8ff',20); await blog(`${bName(t)}は ${msg}`,0.8); }
  else await blog(`${bName(t)}には きかなかった！`,0.6);
}
function physDmg(u,t,mul){
  const crit = R()<1/28 + (u.b.charge?0.05:0);
  let d;
  if(crit) d = eff(u,'atk')*(0.95+R()*0.1);
  else { d = eff(u,'atk')/2 - eff(t,'def')/4; if(d<eff(u,'atk')/16) d = R()*Math.max(2,eff(u,'atk')/16)+ (R()<0.6?1:0); d*= (0.88+R()*0.24); }
  d*=mul; if(u.b.charge) d*=2;
  return {d:Math.max(0,Math.floor(d)),crit};
}
async function physHit(u,t,mul,hitRate=1,extra){
  if(t.hp<=0) return;
  let miss = 0.03 + (u.status.blind?0.5:0) + (eff(t,'agi')>eff(u,'agi')*2?0.08:0);
  if(t.status.sleep||t.status.paralyze) miss=0;
  if(R()<miss || R()>hitRate){ SND.se('miss'); popAt(t,'MISS','#ccc',20); await blog(`ミス！ ${bName(t)}は ひらりと みをかわした！`,0.7); return; }
  const {d,crit}=physDmg(u,t,mul);
  if(t.side==='e'){ BATTLE.fx.push({type:'slash',x:t._x||200,y:t._y||120,r:40,t:0}); }
  if(crit){ SND.se('crit'); await blog(t.side==='e'?'かいしんの いちげき！':'つうこんの いちげき！',0.6); }
  const real = await damage(t,d,crit?'#ffe14a':'#fff');
  if(extra && real.hp>0) await tryStatus(u,real,extra.st,extra.rate);
}

async function doAction(u,act){
  if(u.hp<=0) return;
  const foes=foesOf(u), fr=friendsOf(u);
  if(!alive(foes).length) return;
  u.b.guard=false;
  // 状態異常
  if(u.b.stun){ u.b.stun=false; await blog(`${bName(u)}は うごけない！`); return; }
  if(u.status.sleep){ if(R()<0.35){ delete u.status.sleep; await blog(`${bName(u)}は めをさました！`); } else { u.status.sleep--; if(u.status.sleep<=0 && R()<0.5) delete u.status.sleep; await blog(`${bName(u)}は ねむっている……`); return; } }
  if(u.status.paralyze){ if(R()<0.25){ delete u.status.paralyze; await blog(`${bName(u)}の しびれが とれた！`); } else { await blog(`${bName(u)}は しびれて うごけない！`); return; } }
  if(u.status.confuse){ if(R()<0.3){ delete u.status.confuse; await blog(`${bName(u)}は われにかえった！`); } else { await blog(`${bName(u)}は こんらんしている！`,0.6); const all=alive([...BATTLE.allies,...BATTLE.enemies]).filter(x=>x!==u); const t=pick(all); if(t){ await blog(`${bName(u)}の こうげき！`,0.5); await physHit(u,t,1); } return; } }
  let {id,t}=act;
  if(u.side==='e' && u.anim){ u.anim.act=14; await sleep(140); }
  if(u.side==='a') BSTAT.act(u);
  // 対象の再設定
  const fa=alive(foes);
  if(id==='attack'){ let tg=t&&t[0]; if(!tg||tg.hp<=0) tg=pick(fa); await blog(`${bName(u)}の こうげき！`,0.55); await physHit(u,tg,1); u.b.charge=false; return; }
  if(id==='guard'){ u.b.guard=true; await blog(`${bName(u)}は みを まもっている`); return; }
  const s=SK[id];
  if(!s){ return; }
  if(s.mp>u.mp){ await blog(`${bName(u)}は ${s.name}を となえようとした！`,0.5); await blog('しかし MPが たりない！'); return; }
  if(u.status.silence && isSpell(id)){ await blog(`${bName(u)}は ${s.name}を となえた！`,0.5); await blog('しかし 呪文は ふうじられている！'); return; }
  u.mp-=s.mp; BSTAT.render();
  const verb = s.type==='spell'||s.spell?'を となえた！':s.type==='breath'?'を はいた！':'！';
  await blog(`${bName(u)}の ${s.name}${verb}`,0.6);
  let targets;
  if(s.tgt==='eAll'||s.tgt==='rand') targets=alive(foes);
  else if(s.tgt==='aAll') targets=alive(fr);
  else if(s.tgt==='self') targets=[u];
  else if(s.tgt==='a1'){ targets=[(t&&t[0])||u]; if(s.type!=='revive' && targets[0].hp<=0) targets=[alive(fr).sort((a,b)=>a.hp/a.st.hp-b.hp/b.st.hp)[0]]; }
  else { let tg=t&&t[0]; if(!tg||tg.hp<=0||tg.side===u.side) tg=pick(fa); targets=[tg]; }
  switch(s.type){
    case 'spell': case 'breath': {
      SND.se('spell'); for(const tg of targets){ const pos = tg.side==='e'?{x:tg._x||200,y:tg._y||120}:allyPos(tg); BATTLE.fx.push({type:'el',el:s.el,x:pos.x,y:pos.y,r:tg.side==='e'?70:40,t:0,seed:Math.random()*100}); }
      BATTLE.fx.push({type:'screen',col:EL_COL[s.el],t:0}); await sleep(120);
      for(const tg of targets){ if(tg.hp<=0) continue; let d=ri(s.pw[0],s.pw[1]); if(s.type==='spell') d*=1+eff(u,'int')/600; else d*=1+u.lv/200; d*=resMul(tg,s.el); if(tg.side==='e' && BATTLE.mode!=='wild' && tg.boss) d*=0.9; await damage(tg,d,EL_COL[s.el]); }
      break; }
    case 'phys': {
      if(s.tgt==='rand'){ for(let i=0;i<s.hits;i++){ const fa2=alive(foes); if(!fa2.length) break; await physHit(u,pick(fa2),s.mul,s.hit||1); } }
      else if(s.tgt==='eAll'){ for(const tg of targets) await physHit(u,tg,s.mul,s.hit||1); }
      else { for(let i=0;i<(s.hits||1);i++){ if(targets[0].hp<=0) { const fa2=alive(foes); if(!fa2.length) break; targets[0]=pick(fa2); } await physHit(u,targets[0],s.mul,s.hit||1, s.st?{st:s.st,rate:s.rate}:null); } }
      u.b.charge=false;
      if(s.self==='defdown'){ u.b.buf.def=Math.max(-2,u.b.buf.def-1); }
      break; }
    case 'heal': {
      SND.se('heal'); for(const tg of targets){ const pos=tg.side==='e'?{x:tg._x||200,y:tg._y||120}:allyPos(tg); BATTLE.fx.push({type:'el',el:'heal',x:pos.x,y:pos.y,r:40,t:0,seed:Math.random()*100}); }
      for(const tg of targets){ if(tg.hp<=0) continue; let h = s.pw[0]>=999? tg.st.hp : ri(s.pw[0],s.pw[1])*(1+eff(u,'int')/800); h=Math.min(Math.round(h),tg.st.hp-tg.hp); tg.hp+=h; popAt(tg,h,'#7aff9a'); await blog(`${bName(tg)}の HPが ${h}かいふくした！`,0.7); }
      BSTAT.render(); break; }
    case 'revive': {
      const tg=targets[0]; if(!tg || tg.hp>0){ await blog('しかし なにも おこらなかった',0.6); break; }
      if(R()<s.chance){ tg.hp=Math.max(1,Math.floor(tg.st.hp*s.pw[0])); tg.status={}; SND.se('heal'); await blog(`なんと ${bName(tg)}が 生きかえった！`); if(tg.side==='e'&&tg.anim){ tg.anim.die=0; } } else await blog('しかし 生きかえらなかった……');
      BSTAT.render(); break; }
    case 'cure': { const tg=targets[0]; tg.status={}; await blog(`${bName(tg)}の 状態が もとにもどった！`); BSTAT.render(); break; }
    case 'buff': case 'debuff': {
      for(const tg of targets){ if(tg.hp<=0) continue; const before=tg.b.buf[s.stat]; tg.b.buf[s.stat]=clamp(before+s.v,-2,2);
        if(tg.b.buf[s.stat]===before) await blog(`${bName(tg)}には こうかが なかった`,0.5);
        else await blog(`${bName(tg)}の ${STAT_JP[s.stat]}が ${s.v>0?'あがった':'さがった'}！`,0.6); }
      break; }
    case 'status': { for(const tg of targets) await tryStatus(u,tg,s.st,s.rate); break; }
    case 'special': {
      if(s.fx==='guard'){ u.b.guard=true; await blog(`${bName(u)}は みを まもっている`,0.5); }
      else if(s.fx==='cover'){ const tg=targets[0]; if(tg&&tg!==u){ tg.b.coveredBy=u; await blog(`${bName(u)}は ${bName(tg)}を まもっている`,0.6); } }
      else if(s.fx==='charge'){ u.b.charge=true; await blog(`${bName(u)}は ちからを ためている！`,0.6); }
      else if(s.fx==='drainmp'){ const tg=targets[0]; const v=Math.min(tg.mp,ri(s.pw[0],s.pw[1])); tg.mp-=v; if(id==='suitori') u.mp=Math.min(u.st.mp,u.mp+v); await blog(`${bName(tg)}の MPを ${v}${id==='suitori'?'すいとった':'へらした'}！`,0.7); BSTAT.render(); }
      else if(s.fx==='mpheal'){ const v=Math.min(u.st.mp-u.mp,ri(s.pw[0],s.pw[1])); u.mp+=v; await blog(`${bName(u)}の MPが ${v}かいふくした`,0.6); BSTAT.render(); }
      else if(s.fx==='stun'){ const tg=targets[0]; if(R()<s.rate*(tg.boss?0.4:1)){ tg.b.stun=true; await blog(`${bName(tg)}は ぞぞっとして うごけなくなった！`,0.7); } else await blog(`${bName(tg)}には きかなかった`,0.6); }
      else if(s.fx==='selfdestruct'){ SND.se('crit'); BATTLE.fx.push({type:'screen',col:'#fff',t:0}); const tgs=alive(foes); u.hp=0; await blog(`${bName(u)}は 大爆発した！`,0.6); for(const tg of tgs){ const base=u.st.hp*(0.7+R()*0.4)+u.lv*2; await damage(tg, tg.boss?Math.min(base,tg.st.hp*0.3):base,'#ffcf3a'); } BSTAT.render(); }
      break; }
  }
}

// ---- 戦闘メイン ----
async function runBattle(enemies,opt={}){
  BATTLE.on=true; BATTLE.mode=opt.mode||'wild'; BATTLE.theme=opt.theme||(MAPS.map?MAPS.map.theme:'forest'); if(BATTLE.theme==='town') BATTLE.theme='forest';
  BATTLE.enemies=enemies; BATTLE.allies=G.party; BATTLE.fx=[];
  const letters='ABC'; const cnt={}; enemies.forEach(e=>cnt[e.sid]=(cnt[e.sid]||0)+1); const used={};
  enemies.forEach(e=>{ initB(e,'e'); e.anim={shake:0,blink:0,alpha:1,act:0,die:0}; if(cnt[e.sid]>1){ used[e.sid]=(used[e.sid]||0); e.tag=letters[used[e.sid]++]; } G.seen[e.sid]=1; e.fed=0; });
  G.party.forEach(a=>initB(a,'a'));
  const prev=SCENE; SCENE=BATTLE; HUD.update();
  SND.bgm(opt.bgm || (opt.boss?'boss':'battle')); SND.se('enc');
  BLOG.open(); BSTAT.open();
  const names=Object.keys(cnt).map(sid=>`${MONS[sid].name}${cnt[sid]>1?'たち':''}`).join('と');
  await blog(opt.intro || `${names}が あらわれた！`,1.1);
  let result=null; let turn=0;
  while(!result){
    turn++;
    // コマンド
    const plan={};
    let master=null; // エサ・どうぐ
    const cmd = await commandPhase(plan,opt);
    if(cmd==='escape'){
      if(opt.boss||opt.mode==='tour'){ await blog('しかし にげられない！'); }
      else { const aa=alive(G.party), ea=alive(enemies); const ag=aa.reduce((s,u)=>s+eff(u,'agi'),0)/Math.max(1,aa.length), eg=ea.reduce((s,u)=>s+eff(u,'agi'),0)/Math.max(1,ea.length);
        const ch=clamp(0.5+(ag-eg)/150,0.25,0.9) + (turn>2?0.1:0);
        await blog('テルイたちは にげだした！',0.6);
        if(R()<ch){ result='escape'; break; } await blog('しかし まわりこまれてしまった！'); }
    } else if(cmd && cmd.kind==='smoke'){ await blog('けむりだまを なげた！',0.6); await blog('テルイたちは うまく にげきった！'); result='escape'; break; }
    else if(cmd && cmd.kind) master=cmd;
    // 行動順
    const acts=[];
    if(master) acts.push({u:null,master,spd:9999});
    if(cmd!=='escape' || true){
      for(const a of alive(G.party)){ if(cmd==='escape') continue; let p=plan[a.uid]; acts.push({u:a,p,spd:eff(a,'agi')*(0.75+R()*0.5)}); }
      for(const e of alive(enemies)){ acts.push({u:e,spd:eff(e,'agi')*(0.75+R()*0.5)}); if(e.boss && e.lv>=40 && R()<0.35) acts.push({u:e,spd:eff(e,'agi')*(0.5+R()*0.5)}); }
    }
    acts.sort((a,b)=>b.spd-a.spd);
    for(const A of acts){
      if(A.master){ await masterAction(A.master); if(!alive(enemies).length) break; continue; }
      const u=A.u; if(u.hp<=0) continue;
      if(!alive(G.party).length||!alive(enemies).length) break;
      let act;
      if(u.side==='a'){
        if(A.p){ const disobey = R() < Math.max(0,(50-u.loyal)/100); if(disobey){ await blog(`${bName(u)}は いうことを きかない！`,0.6); act=chooseAI(u,1); } else act=A.p; }
        else act=chooseAI(u,u.tactic);
      } else act=chooseAI(u, u.boss?0:1);
      await doAction(u,act);
      if(!alive(G.party).length||!alive(enemies).length) break;
    }
    // ターン終了
    for(const u of [...G.party,...enemies]){ if(u.hp<=0) continue; u.b.coveredBy=null;
      if(u.status.poison){ const d=Math.max(1,Math.floor(u.st.hp/12)); u.hp=Math.max(0,u.hp-d); await blog(`${bName(u)}は どくで ${d}のダメージ！`,0.5); if(u.hp<=0) await kill(u); }
      for(const k of ['confuse','silence','blind']){ if(u.status[k]){ u.status[k]--; if(u.status[k]<=0){ delete u.status[k]; } } }
    }
    BSTAT.render();
    if(!alive(enemies).length) result='win';
    else if(!alive(G.party).length) result='lose';
  }
  let out=result;
  if(result==='win') out = await victory(enemies,opt);
  else if(result==='lose'){ SND.se('down'); await blog(opt.mode==='tour'?'テルイの モンスターは ぜんめつした……':'テルイの モンスターは ぜんめつした！',1); if(opt.mode!=='tour') await blog('めのまえが まっくらになった……',1.3); }
  // 後始末
  G.party.forEach(a=>{ delete a.b; delete a.side; for(const k of ['sleep','confuse','silence','blind','paralyze']) delete a.status[k]; });
  BLOG.close(); BSTAT.close(); UI.clear();
  BATTLE.on=false; SCENE=prev; HUD.update();
  if(SCENE===MAPS) SND.bgm(MAPS.map.kind==='town'?'town':MAPS.map.boss?'boss':'dungeon');
  return out==='lose'?'lose':result;
}

async function commandPhase(plan,opt){

      if(!its.length){ await blogWait('つかえる どうぐが ない！'); continue; }
      const ii=await UI.menu({title:'どうぐ',items:its.map(k=>({label:IT[k].name,sub:'×'+G.items[k]})),cls:'m-sub',info:i=>IT[its[i]].desc}); if(ii<0) continue;

async function masterAction(m){

    const it=IT[m.item]; useItemCount(m.item);

    const eat = R() < (tg.boss?0.7:0.9);
    if(eat){ tg.fed += it.pw; await blog(`${bName(tg)}は ${it.name}を むしゃむしゃ たべている！`); if(it.pw>=55 || R()<0.25){ tg.b.stun=true; await blog(`${bName(tg)}は うっとりしている！`,0.7); } }
    else await blog(`${bName(tg)}は ${it.name}を むしした！`);

    else if(it.k==='cure'||it.k==='cureAll'){ tg.status={}; await blog(`${monName(tg)}の 状態が もとにもどった！`); }
    else if(it.k==='healAll'){ for(const o of alive(G.party)){ o.hp=Math.min(o.st.hp,o.hp+it.pw); } SND.se('heal'); await blog('みんなの HPが かいふくした！'); }
    else if(it.k==='healAllFull'){ for(const o of alive(G.party)){ o.hp=o.st.hp; o.mp=o.st.mp; } SND.se('heal'); await blog('みんなの HPとMPが ぜんかいした！'); }
    else if(it.k==='battle'){ SND.se('spell'); BATTLE.fx.push({type:'screen',col:EL_COL[it.el],t:0}); for(const e of alive(BATTLE.enemies)) await damage(e,ri(it.pw[0],it.pw[1])*resMul(e,it.el),EL_COL[it.el]); }

    else if(it.k==='battleBuff'){ for(const o of alive(G.party)){ o.b.buf[it.stat]=clamp(o.b.buf[it.stat]+it.v,-2,2); } await blog(`みんなの ${STAT_JP[it.stat]}が あがった！`); }
    BSTAT.render();
  }
}

function expOf(e){ const m=MONS[e.sid]; return Math.floor((4+e.lv*e.lv*0.6+e.lv*3)*(0.6+m.rank*0.1)*(e.boss?4:1)); }
async function victory(enemies,opt){
  SND.bgm(null); SND.se('win');
  const exp=enemies.reduce((s,e)=>s+expOf(e),0)*(opt.mode==='tour'?0.7:1)|0;
  const gold=opt.mode==='tour'?0:enemies.reduce((s,e)=>s+Math.floor(e.lv*2.2+MONS[e.sid].rank*4+ri(0,5)),0)*(opt.boss?3:1);
  await blog(opt.mode==='tour'?'しょうぶあり！ テルイの かち！':'まものたちを やっつけた！',0.9);
  const al=G.party.filter(o=>o.hp>0); const before=new Map(G.party.map(o=>[o.uid,o.lv]));
  await blog(`それぞれ ${exp}ポイントの けいけんちを かくとく！`);
  if(gold){ G.gold+=gold; await blog(`${gold}ゴールドを 手に入れた！`); }
  for(const o of al){
    o.loyal=Math.min(100,o.loyal+1);
    const res=gainExp(o,exp);
    for(const r of res){ SND.se('lvup'); BSTAT.render(); await blog(`${monName(o)}は レベル${o.lv - res.length + res.indexOf(r) + 1}に あがった！`,0.9);
      for(const sid of r.learned){ await blog(`${monName(o)}は ${SK[sid].name}を おぼえた！`,0.9); } }
  }
  // ドロップ
  let drop=null;
  if(opt.mode!=='tour' && R()<0.12){ drop=pick(['iyashigusa','honeniku','dokunuki','yakiniku','maryokushizuku','tako_yaki']); addItem(drop); await blog(`まものは ${IT[drop].name}を おとしていった`); }
  // 結果ウィンドウ
  { const rows=G.party.map(o=>{ const b=before.get(o.uid), up=o.lv>b; const r=o.lv>=maxLv(o)?1:(o.exp-expFor(o.lv))/Math.max(1,expFor(o.lv+1)-expFor(o.lv));
      return `<div class="rr ${o.hp<=0?'dead':''}">${monImgHTML(o.sid,40)}<div class="rn">${monName(o)}<br><span class="${up?'up':''}">Lv${b}${up?' → '+o.lv:''}</span></div><div class="rx">${o.hp>0?'+'+exp:'---'}<div class="bar xp"><i style="width:${Math.round(r*100)}%"></i></div></div></div>`; }).join('');
    const el=UI.panel(`<div class="mt">せんとう けっか</div>${rows}<div class="rg">${gold?`<span>💰 ${gold}G</span>`:''}${drop?`<span>🎁 ${IT[drop].name}</span>`:''}</div>`,'p-result');
    if(BATTLE.auto || G.speed===2){ setTimeout(()=>{ const top=UI.stack[UI.stack.length-1]; if(top&&top.el===el) top.onInput('a'); }, 1300); }
    await UI.waitClose(el); }
  if(opt.mode==='wild'||opt.mode==='boss'){
    // スカウト
    let best=null, bestV=0;
    for(const e of enemies){
      const m=MONS[e.sid];
      let ch = e.boss ? (G.cleared[G.gate]?0.12:0.25) + e.fed*0.008 : m.scout*0.45 + e.fed*0.011*(1.2-m.rank*0.06);
      if(m.legend) ch = 0.02 + e.fed*0.003;
      if(R()<ch){ const v=ch+R(); if(v>bestV){ bestV=v; best=e; } }
    }
    if(best){
      BLOG.close(); BSTAT.close(); UI.clear();
      await UI.say(`おや？ ${monName(best)}が おきあがり なかまに なりたそうに こちらを みている！`);
      const yes=await UI.yesno(`${monName(best)}を なかまに しますか？`);
      if(yes){ const o=newMon(best.sid,best.lv,{gender:best.gender,loyal:clamp(40+best.fed,30,90)}); o.st={...best.st}; fullHeal(o); const where=addMon(o);
        if(where){ SND.se('join'); await UI.say(`${monName(o)}が なかまに くわわった！`+(where==='ranch'?'（牧場へ おくられた）':'')); }
        else await UI.say('しかし これいじょう モンスターを つれていけない……'); }
      else await UI.say(`${monName(best)}は さびしそうに さっていった……`);
    }
  }
  return 'win';
}

function wildEnemies(gi,floor){
  const g=GATES[gi]; const pool=MONS.filter(m=>!m.legend && m.rank>=g.ranks[0] && m.rank<=g.ranks[1] && (g.fams.includes(m.fam) || R()<0.25));
  const wantN = gi===0? (R()<0.7?1:2) : gi<4 ? ri(1,3) : (R()<0.15?2:3);
  const out=[]; const n=clamp(wantN,1,3);
  for(let i=0;i<n;i++){ const m=pick(pool.length?pool:MONS.filter(x=>x.rank===1)); const lv=clamp(ri(g.lv[0],g.lv[1])+Math.floor(floor/2),1,m.maxLv); out.push(newMon(m.id,lv)); }
  return out;
}

function tourTeam(c,round){
  const cl=CLASSES[c]; const pool=MONS.filter(m=>!m.legend&&m.rank>=cl.ranks[0]&&m.rank<=cl.ranks[1]);
  const n = c===0&&round===0?2:3; const team=[];
  for(let i=0;i<n;i++){ const m=pick(pool); team.push(newMon(m.id,clamp(cl.lv+round*2+ri(-2,1),1,m.maxLv))); }
  return team;
}
async function tournament(c){
  const cl=CLASSES[c]; const rewin=c<=G.classWon;
  const ms = STORY2.masters[c]; const pool=shuffle(MASTER_NAMES.slice());
  if(!rewin) await UI.say(STORY2.classPre[c]);
  await UI.say(`${cl.name} たいかい スタート！ 3かい かちぬけば ゆうしょうだ！`);
  for(let round=0;round<3;round++){
    G.party.forEach(fullHeal);
    const final = c===7 && round===2 && !G.ended;
    const md = (!rewin && ms[round]) ? ms[round] : {n:pool[round]};
    let team, name=md.n;
    if(final){ name='カゲボウ'; await storyScene('arena',STORY2.final,'boss'); team=['マジンオウ','コクリュウオウ','レイスオウ'].map(n=>{ const o=newMon(MON_BY_NAME[n].id,62); STATS.forEach(s=>o.st[s]=capStat(s,o.st[s]*(s==='hp'?1.6:1.1))); fullHeal(o); o.boss=true; return o; }); }
    else if(md.team){ team=md.team.map(n=>{ const m=MON_BY_NAME[n]; return newMon(m.id,clamp(cl.lv+round*2+1,1,m.maxLv)); }); }
    else team=tourTeam(c,round);
    if(name==='カゲボウ' && !final) name=pool[round];
    await UI.say(`${['1かいせん','じゅんけっしょう','けっしょう'][round]}　VS ${name}`);
    if(md.pre && !final) await UI.say(md.pre.split('\n'));
    const res=await runBattle(team,{mode:'tour',theme:'sky',intro:`${name}が しょうぶを しかけてきた！`,bgm:final||md.rival?'boss':'battle'});
    if(res!=='win'){ G.party.forEach(fullHeal); await UI.say(`ざんねん！ ${name}に まけてしまった……`); return; }
    if(md.post && !final) await UI.say(md.post.split('\n')); else await UI.say(`${name}に かった！`);
  }
  G.party.forEach(fullHeal);
  SND.se('win');
  await UI.say(`おめでとう！ テルイは ${cl.name}で ゆうしょうした！`);
  G.gold+=rewin?Math.floor(cl.gold/2):cl.gold; addItem(cl.prize); HUD.update();
  await UI.say(`しょうきん ${rewin?Math.floor(cl.gold/2):cl.gold}ゴールドと ${IT[cl.prize].name}を もらった！`);
  if(!rewin){
    G.classWon=c;
    if(c===7){ await storyScene('ending',STORY2.ending,'title'); G.ended=true; addItem('ougonnotako'); await storyScene('village',STORY2.epilogue,'town'); await credits(); }
    else { await UI.say(STORY2.classWin[c]); if(STORY2.dream[c]) await storyScene('dream',STORY2.dream[c],'title'); if(c===3) G.flags.kagePending=1; }
  }
  saveGame(); SND.bgm(null); SND.bgm('town');
}

  const needMon=['heal','mp','revive','cure','cureAll','seed','exp','loyal','expSeed'];
  if(needMon.includes(it.k)){
    const ti=await UI.menu({title:'だれに つかう？',items:G.party.map(o=>({label:monName(o),sub:`H${o.hp}/${o.st.hp} M${o.mp}/${o.st.mp}`})),cls:'m-wide'}); if(ti<0) return; const o=G.party[ti];
    if(it.k==='heal'){ if(o.hp<=0){ await UI.say('たおれている モンスターには きかない'); return; } const h=Math.min(o.st.hp-o.hp,it.pw); o.hp+=h; await UI.say(`${monName(o)}の HPが ${h}かいふくした！`); }
    else if(it.k==='mp'){ const h=Math.min(o.st.mp-o.mp,it.pw); o.mp+=h; await UI.say(`${monName(o)}の MPが ${h}かいふくした！`); }
    else if(it.k==='revive'){ if(o.hp>0){ await UI.say('げんきだ。つかう ひつようはない'); return; } o.hp=Math.floor(o.st.hp/2); await UI.say(`${monName(o)}が 生きかえった！`); }
    else if(it.k==='cure'||it.k==='cureAll'){ o.status={}; await UI.say(`${monName(o)}の 状態が もとにもどった`); }
    else if(it.k==='seed'){ const v=ri(it.pw[0],it.pw[1]); o.st[it.stat]=capStat(it.stat,o.st[it.stat]+v); await UI.say(`${monName(o)}の ${STAT_JP[it.stat]}が ${v}あがった！`); }
    else if(it.k==='exp'||it.k==='expSeed'){ const amt = it.k==='expSeed'? Math.max(1,expFor(o.lv+1)-o.exp) : it.pw; const res=gainExp(o,amt); if(!res.length && o.lv>=maxLv(o)){ await UI.say('これいじょう そだたない'); return; } await UI.say(`${monName(o)}は けいけんちを えた！`); for(const r of res){ SND.se('lvup'); } if(res.length) await UI.say(`${monName(o)}は レベル${o.lv}に なった！`); for(const r of res) for(const s of r.learned) await UI.say(`${monName(o)}は ${SK[s].name}を おぼえた！`); }
    else if(it.k==='loyal'){ o.loyal=Math.min(100,o.loyal+it.pw); await UI.say(`${monName(o)}は うれしそうだ！ なつき度が あがった`); }
    useItemCount(k); SND.se('heal'); return;
  }
  if(it.k==='healAll'||it.k==='healAllFull'){ for(const o of G.party){ if(o.hp>0){ o.hp=it.k==='healAll'?Math.min(o.st.hp,o.hp+it.pw):o.st.hp; if(it.k==='healAllFull') o.mp=o.st.mp; } } useItemCount(k); SND.se('heal'); await UI.say('みんな げんきに なった！'); return; }
  if(it.k==='escape'){ if(MAPS.map.kind==='town'){ await UI.say('ここでは つかえない'); return; } const gg=G.gate; useItemCount(k); await UI.say(`テルイは ${it.name}を つかった！`); await fade(async()=>returnToHall(gg)); return; }
  if(it.k==='repel'){ G.repel=it.pw; G.lure=0; useItemCount(k); await UI.say('モンスターが よってこなくなった'); return; }
  if(it.k==='lure'){ G.lure=it.pw; G.repel=0; useItemCount(k); await UI.say('モンスターが よってくる においが ただよう……'); return; }
  if(it.k==='mapitem'){ if(MAPS.map.kind==='town'){ await UI.say('ここでは つかえない'); return; } MAPS.showStairs=true; useItemCount(k); await UI.say('かいだんの ばしょが わかった！'); return; }
  await UI.say(it.desc);
}
async function settingMenu(){
  let sel=0;
  while(true){
    const r=await UI.menu({title:'せってい',start:sel,items:[
      {label:'せんとうの はやさ',sub:['ふつう','はやい','さいそく'][G.speed??1]},
      {label:'メッセージの はやさ',sub:['ふつう','はやい','しゅんかん'][G.textSpeed??1]},
      {label:'ダッシュ(RUN)',sub:G.run?'ON':'OFF'},
      {label:'ミニマップ',sub:G.minimap!==false?'ON':'OFF'},
      {label:'おと',sub:SND.on?'ON':'OFF'},
      {label:'タイトルへ もどる'},{label:'もどる'}]});
    if(r<0||r===6) return; sel=r;
    if(r===0) G.speed=((G.speed??1)+1)%3;
    else if(r===1) G.textSpeed=((G.textSpeed??1)+1)%3;
    else if(r===2){ G.run=!G.run; updateRunBtn(); }
    else if(r===3) G.minimap=!(G.minimap!==false);
    else if(r===4){ SND.on=!SND.on; if(!SND.on){ SND.bgmName=null; clearInterval(SND.bgmTimer); } else SND.bgm(MAPS.map.kind==='town'?(MAPS.map.bgm||'town'):'dungeon'); }
    else if(r===5){ if(await UI.yesno('きろくしていない ぼうけんは きえます。もどりますか？')){ UI.clear(); goTitle(); return; } }
  }
}

const CV={el:null,c:null,W:0,H:0,dpr:1};
function resize(){
  const land = window.innerWidth>window.innerHeight; document.body.classList.toggle('land',land); document.body.classList.toggle('port',!land);
  const scr=document.getElementById('screen'); const r=scr.getBoundingClientRect();
  CV.dpr=Math.min(2,window.devicePixelRatio||1); CV.W=Math.max(100,r.width); CV.H=Math.max(100,r.height);
  CV.el.width=Math.round(CV.W*CV.dpr); CV.el.height=Math.round(CV.H*CV.dpr); CV.el.style.width=CV.W+'px'; CV.el.style.height=CV.H+'px';
}
let lastT=0;
let TRANS=null;
function drawTrans(c,W,H,dt){
  if(!TRANS) return; TRANS.t+=dt; let k=clamp(TRANS.t/TRANS.dur,0,1); if(TRANS.phase==='out') k=1-k;
  const N=10, cx=W/2, cy=H/2, R=Math.hypot(W,H); const rot=TRANS.t/180;
  c.fillStyle='#000'; c.beginPath();
  for(let i=0;i<N;i++){ const a0=rot+i*Math.PI*2/N; const a1=a0+k*Math.PI*2/N; c.moveTo(cx,cy); c.arc(cx,cy,R,a0,a1); c.closePath(); }
  c.fill();
  if(TRANS.t>=TRANS.dur){ const done=TRANS.done; if(TRANS.phase==='out') TRANS=null; else { TRANS.t=TRANS.dur; } if(done){ TRANS&&(TRANS.done=null); done(); } }
}
function swirlIn(){ return new Promise(r=>{ SND.se('enc'); TRANS={phase:'in',t:0,dur:420,done:r}; }); }
function swirlOut(){ TRANS={phase:'out',t:0,dur:380,done:null}; }

function loop(t){
  const dt=Math.min(50,t-(lastT||t)); lastT=t;
  try{
    if(SCENE===MAPS) MAPS.update(dt);
    const c=CV.c; c.setTransform(CV.dpr,0,0,CV.dpr,0,0); c.imageSmoothingEnabled=true;
    if(SCENE && SCENE.draw) SCENE.draw(c,CV.W,CV.H);
    drawTrans(c,CV.W,CV.H,dt);
    if(G) G.time+=dt;
  }catch(e){ console.error(e); }
  requestAnimationFrame(loop);
}

  UI.init(); setupPad(); resize();
  window.addEventListener('resize',()=>setTimeout(resize,50)); window.addEventListener('orientationchange',()=>setTimeout(resize,200));
  document.getElementById('screen').addEventListener('click',()=>{ SND.init(); });
  let tapStart=null;
  CV.el.addEventListener('pointerdown',e=>{ tapStart={x:e.clientX,y:e.clientY,t:performance.now()}; SND.init(); });
  CV.el.addEventListener('pointerup',e=>{ if(!tapStart) return; const ok=Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y)<16 && performance.now()-tapStart.t<700; tapStart=null; if(!ok) return; const r=CV.el.getBoundingClientRect(); onTap(e.clientX-r.left,e.clientY-r.top); });
  document.getElementById('hud').addEventListener('click',e=>{ const b=e.target.closest('[data-hud]'); if(!b) return; e.stopPropagation(); SND.init();
    if(b.dataset.hud==='menu'){ if(SCENE===MAPS && !UI.stack.length && !MAPS.busy && !FADING) MAPS.onPress('b'); }
    if(b.dataset.hud==='map'){ G.minimap=!G.minimap; } });
  requestAnimationFrame(loop);
  goTitle();
});
function onTap(x,y){
  const top=UI.stack[UI.stack.length-1];
  if(top && top.isMsg){ top.onInput('a'); return; }
  if(UI.stack.length) return;
  if(SCENE===MAPS) MAPS.tap(x,y);
  else if(SCENE===BATTLE && BATTLE.skip) BATTLE.skip();
}
// デバッグ／テスト用
window.__T = { get G(){return G;}, MONS, SK, IT, GATES, newMon, doBreed, breedResult, runBattle, MAPS, UI, press, FACILITY, tournament, get SCENE(){return SCENE;}, gainExp, setG(g){G=g;} };

</script>
